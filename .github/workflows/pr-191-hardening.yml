name: Apply PR 191 hardening

on:
  push:
    branches:
      - fix/pr-191-image-hardening

concurrency:
  group: pr-191-hardening-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # Required only for this one-shot remediation commit.

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    name: Apply and validate hardening
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Apply targeted changes
        run: |
          python3 scripts/apply-pr-191-hardening.py
          python3 scripts/fix-pr-191-fixture.py

      - name: Install dependencies
        run: npm ci

      - name: Format changed files
        run: npx prettier --write src/features/session/images.ts src/features/session/notesStore.ts src/features/session/SessionNotesPanel.tsx src/features/session/SessionImageViewer.tsx src/features/session/SessionView.tsx src/stories/SessionImageViewer.stories.tsx src/stories/SessionNotesPanel.stories.tsx tests/unit/session-images.test.ts

      - name: Validate frontend
        run: npm run build && npm run lint && npm run test && npm run check-stories

      - name: Commit remediation and remove one-shot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm scripts/apply-pr-191-hardening.py scripts/fix-pr-191-fixture.py .github/workflows/pr-191-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: harden session image handling"
          git push
