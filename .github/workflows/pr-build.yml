name: PR installers

# Builds real, installable StudyVis bundles from a pull request and attaches
# them as artifacts, so a change can be smoke-tested on an actual machine
# before it reaches main.
#
# Why this exists: CI proves the code compiles, lints, and passes the
# automated gates, and that is genuinely all it proves. There are no
# component tests (vitest is node-env only), no desktop smoke test, and the
# things this app gets wrong most often — a camera stream that never reaches
# a late joiner, a sidecar that dies at session start — are only visible with
# two builds talking to each other. Until now the first installable build of
# any change appeared AFTER release-prep had already pushed an immutable tag.
#
# Why it is label-gated rather than automatic: a full Tauri build is ~30-60
# minutes per platform and most PRs here are docs or CI. Add the
# `build-installers` label to a PR and the builds start; push more commits
# and they rebuild while the label is on. `workflow_dispatch` covers building
# from a branch without a PR.
#
# These bundles are NOT releases. `createUpdaterArtifacts` is switched off
# below, so no `latest.json` is produced and nothing here can be mistaken for
# — or consumed by — the update channel.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # `pull_request`, never `pull_request_target`: fork code must run with a
    # read-only token and no access to secrets. Nothing in this workflow
    # needs either, and the label is maintainer-applied, so a fork PR getting
    # built is fine.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'build-installers') }}
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            llama-triple: aarch64-apple-darwin
          - label: Windows
            platform: windows-latest
            rust-targets: ''
            args: --bundles nsis
            llama-triple: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; the toolchain input selects the channel
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target
          # Keep PR builds out of the cache main's builds read from. A PR is
          # untrusted input; letting it write the shared cache is the
          # cache-poisoning path into the release pipeline.
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      # Release-profile builds fail without a real sidecar binary, by design
      # (build.rs only writes a placeholder for debug builds).
      - name: Fetch llama-server prebuild
        shell: bash
        run: bash scripts/fetch-llama-server.sh --triple ${{ matrix.llama-triple }}

      # The config override is what makes this safe to run without secrets:
      # with createUpdaterArtifacts on, the bundler demands the minisign key
      # and fails. Off, it emits only the installer — which is all a
      # smoke test needs, and means no PR artifact can ever be fed to a
      # client's updater.
      - name: Build the app bundle (no updater artifacts, no signing)
        shell: bash
        run: |
          npm run tauri -- build ${{ matrix.args }} \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find src-tauri/target -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' \) \
            -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v7
        with:
          name: studyvis-${{ matrix.llama-triple }}-${{ github.event.pull_request.number || github.ref_name }}
          path: out/
          if-no-files-found: error
          # Unsigned installers of unreviewed code. Short retention keeps them
          # from lingering as a download anyone might mistake for a release.
          retention-days: 7

      - name: Explain what these artifacts are
        shell: bash
        run: |
          {
            echo "### ${{ matrix.label }} test build"
            echo
            echo "Unsigned, **not** a release, no auto-update manifest."
            echo "Expect the usual Gatekeeper/SmartScreen warning (INSTALL.md)."
            echo "Installing this over a real StudyVis install replaces it."
          } >> "$GITHUB_STEP_SUMMARY"
