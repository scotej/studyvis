name: Create native PR stack 191-192

on:
  push:
    branches:
      - fix/pr-191-image-hardening

concurrency:
  group: create-native-stack-191-192
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-stack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub-native pull request stack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/stacks" \
            --data '{"pull_requests":[191,192]}'

      - name: Remove one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/create-native-stack-191-192.yml?ref=${GITHUB_REF_NAME}" \
            | jq -r '.sha')
          curl --fail-with-body --silent --show-error \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/.github/workflows/create-native-stack-191-192.yml" \
            --data "{\"message\":\"chore: remove native stack workflow\",\"sha\":\"${sha}\",\"branch\":\"${GITHUB_REF_NAME}\"}"
