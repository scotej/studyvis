name: PR 191 remediation

on:
  push:
    branches:
      - feat/session-image-sharing-185

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.head_commit.message == 'ci: run PR 191 remediation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply targeted fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/features/session/SessionView.tsx')
          text = path.read_text()

          replacements = [
              (
                  """  const [openSessionImage, setOpenSessionImage] = useState<SessionImage | null>(
    null
  )""",
                  """  const [openSessionImageId, setOpenSessionImageId] = useState<string | null>(
    null
  )
  const openSessionImage =
    openSessionImageId === null
      ? null
      : (sessionImages.find((image) => image.id === openSessionImageId) ?? null)
  useEffect(() => {
    if (openSessionImageId !== null && openSessionImage === null) {
      setOpenSessionImageId(null)
    }
  }, [openSessionImageId, openSessionImage])""",
              ),
              (
                  """      const localBlob = new Blob([payload.bytes.slice()], {
        type: payload.metadata.mime_type,
      })
      useNotesStore.getState().appendImage({
        fromEdPubkeyHex: myEdPubkeyHex,
        mine: true,
        blob: localBlob,
        filename: payload.metadata.filename,
        mimeType: payload.metadata.mime_type,
        width: payload.metadata.width,
        height: payload.metadata.height,
        ts: payload.metadata.ts,
      })
      await imageAction.send(
        payload.bytes,
        undefined,
        payload.metadata as ImageMetadata
      )""",
                  """      await imageAction.send(
        payload.bytes,
        undefined,
        payload.metadata as ImageMetadata
      )
      const localBlob = new Blob([payload.bytes.slice()], {
        type: payload.metadata.mime_type,
      })
      useNotesStore.getState().appendImage({
        fromEdPubkeyHex: myEdPubkeyHex,
        mine: true,
        blob: localBlob,
        filename: payload.metadata.filename,
        mimeType: payload.metadata.mime_type,
        width: payload.metadata.width,
        height: payload.metadata.height,
        ts: payload.metadata.ts,
      })""",
              ),
              (
                  """            onOpenImage={setOpenSessionImage}""",
                  """            onOpenImage={(image) => setOpenSessionImageId(image.id)}""",
              ),
              (
                  """          if (!open) setOpenSessionImage(null)""",
                  """          if (!open) setOpenSessionImageId(null)""",
              ),
          ]

          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one SessionView match, found {text.count(old)}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)

          viewer_story = Path('src/stories/SessionImageViewer.stories.tsx')
          text = viewer_story.read_text()
          text = text.replace(
              "import type { Meta, StoryObj } from '@storybook/react-vite'",
              "import type { Meta, StoryObj } from '@storybook/react-vite'",
          )
          start = text.index('const IMAGE_URL =')
          end = text.index('\n\nfunction ViewerStory()')
          fixture = """const IMAGE_BYTES = new Uint8Array([
  137, 80, 78, 71, 13, 10, 26, 10, 0, 0, 0, 13, 73, 72, 68, 82, 0, 0, 0, 1,
  0, 0, 0, 1, 8, 4, 0, 0, 0, 181, 28, 12, 2, 0, 0, 0, 11, 73, 68, 65, 84,
  120, 218, 99, 252, 255, 31, 0, 3, 3, 2, 0, 238, 254, 243, 127, 0, 0, 0, 0,
  73, 69, 78, 68, 174, 66, 96, 130,
])
const IMAGE_URL =
  'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAFgwJ/lKpZvgAAAABJRU5ErkJggg=='

const image: SessionImage = {
  id: 'alice:1:1',
  fromEdPubkeyHex: 'alice',
  mine: false,
  blob: new Blob([IMAGE_BYTES], { type: 'image/png' }),
  objectUrl: IMAGE_URL,
  filename: 'linear-algebra-notes.png',
  mimeType: 'image/png',
  width: 1,
  height: 1,
  ts: 1,
}"""
          viewer_story.write_text(text[:start] + fixture + text[end:])

          notes_story = Path('src/stories/SessionNotesPanel.stories.tsx')
          text = notes_story.read_text()
          text = text.replace(
              "import type { Meta, StoryObj } from '@storybook/react-vite'",
              "import type { Meta, StoryObj } from '@storybook/react-vite'\nimport { fn } from 'storybook/test'",
          )
          addition = """

const IMAGE_URL =
  'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAFgwJ/lKpZvgAAAABJRU5ErkJggg=='
const storyImage: SessionImage = {
  id: `alice:${NOW + 5}:5`,
  fromEdPubkeyHex: 'alice',
  mine: false,
  blob: new Blob(
    [
      new Uint8Array([
        137, 80, 78, 71, 13, 10, 26, 10, 0, 0, 0, 13, 73, 72, 68, 82, 0, 0,
        0, 1, 0, 0, 0, 1, 8, 4, 0, 0, 0, 181, 28, 12, 2, 0, 0, 0, 11, 73,
        68, 65, 84, 120, 218, 99, 252, 255, 31, 0, 3, 3, 2, 0, 238, 254, 243,
        127, 0, 0, 0, 0, 73, 69, 78, 68, 174, 66, 96, 130,
      ]),
    ],
    { type: 'image/png' }
  ),
  objectUrl: IMAGE_URL,
  filename: 'study-notes.png',
  mimeType: 'image/png',
  width: 1,
  height: 1,
  ts: NOW + 5,
}

export const WithImage: Story = {
  args: {
    images: [storyImage],
    onOpenImage: fn(),
  },
}
"""
          if 'export const WithImage' not in text:
              text += addition
          notes_story.write_text(text)

          tests = Path('tests/unit/session-images.test.ts')
          text = tests.read_text()
          text = text.replace(
              "  IMAGE_MAX_BYTES,",
              "  IMAGE_MAX_BYTES,\n  inspectImageBytes,",
          )
          text = text.replace(
              "  const bytes = new Uint8Array([1, 2, 3, 4])",
              """  const bytes = new Uint8Array([
    137, 80, 78, 71, 13, 10, 26, 10, 0, 0, 0, 13, 73, 72, 68, 82, 0, 0, 0, 1,
    0, 0, 0, 1, 8, 4, 0, 0, 0, 181, 28, 12, 2, 0, 0, 0, 11, 73, 68, 65, 84,
    120, 218, 99, 252, 255, 31, 0, 3, 3, 2, 0, 238, 254, 243, 127, 0, 0, 0, 0,
    73, 69, 78, 68, 174, 66, 96, 130,
  ])""",
          )
          text = text.replace('    width: 640,\n    height: 480,', '    width: 1,\n    height: 1,')
          text = text.replace('expect(verified?.blob.size).toBe(4)', 'expect(verified?.blob.size).toBe(payload.bytes.byteLength)')
          text = text.replace('{ ...payload.metadata, width: 641 }', '{ ...payload.metadata, width: 2 }')
          marker = """  test('validates supported type and 5 MB transfer cap', () => {"""
          security_test = """  test('rejects forged dimensions and excessive decoded resources', async () => {
    const { payload } = await fixture()
    const forged = payload.bytes.slice()
    forged[19] = 2
    expect(inspectImageBytes(forged, 'image/png')).toBeNull()

    const huge = payload.bytes.slice()
    huge[16] = 0
    huge[17] = 0
    huge[18] = 64
    huge[19] = 0
    huge[20] = 0
    huge[21] = 0
    huge[22] = 64
    huge[23] = 0
    expect(inspectImageBytes(huge, 'image/png')).toBeNull()
  })

"""
          if security_test not in text:
              text = text.replace(marker, security_test + marker)
          tests.write_text(text)

          Path('.github/workflows/pr-191-remediation.yml').unlink()

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format

      - name: Frontend gates
        run: |
          npm run build
          npm run lint
          npm run test
          npm run check-tokens
          npm run check-strings
          npm run check-migrations
          npm run check-stories
          npm run check-contrast
          npm run build-storybook
          npm run check-a11y

      - name: Rust gates
        working-directory: src-tauri
        run: |
          cargo test
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo deny check

      - name: Commit remediation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: address image sharing review findings"
          git push origin HEAD:feat/session-image-sharing-185
