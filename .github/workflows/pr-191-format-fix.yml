name: PR 191 format fix

on:
  push:
    branches:
      - feat/session-image-sharing-185
    paths:
      - .github/workflows/pr-191-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/session-image-sharing-185
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format test and remove one-shot workflow
        run: |
          npx prettier --write tests/unit/session-images.test.ts
          rm .github/workflows/pr-191-format-fix.yml

      - name: Commit exact formatter output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/unit/session-images.test.ts .github/workflows/pr-191-format-fix.yml
          git commit -m 'style: format session image tests'
          git push origin HEAD:feat/session-image-sharing-185
