name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflows that mint and gate the only update channel for unsigned
# installers must not trust mutable third-party refs: a moved tag/branch on
# any of these executes attacker code in jobs whose artifacts friends install
# with SmartScreen/Gatekeeper already bypassed. Third-party actions are
# SHA-pinned (trailing comment = the tag the SHA was resolved from);
# actions/* and github/* stay on major tags (GitHub-owned). GITHUB_TOKEN is
# scoped read-only as drift-proofing against a future repo/org default change.
#
# That paragraph is now enforced rather than merely asserted: the `workflows`
# job below runs zizmor with the policy in .github/zizmor.yml, which fails
# the build on any third-party action that is not hash-pinned. Refreshing the
# pins is no longer manual either — .github/dependabot.yml bumps the SHA and
# the trailing version comment together (which is why that comment must END
# with the version).
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # No job in this workflow pushes. Leaving the token on disk for
          # every later step — including ones that run third-party code —
          # is free credential exposure.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Test
        run: npm test

      - name: Type-check + Vite build
        run: npm run build

      - name: Storybook build
        run: npm run build-storybook

      # PR preview of the component workbench. main publishes to GitHub Pages
      # (pages.yml); a PR cannot, because Pages has exactly one live site — so
      # reviewers get the same build as a downloadable artifact instead.
      # Reuses the build above rather than repeating it in another workflow.
      - name: Upload Storybook preview (pull requests)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: storybook-preview-pr${{ github.event.pull_request.number }}
          path: storybook-static
          if-no-files-found: error
          retention-days: 7

      # V3-P7 — Install only the Chromium browser test-storybook needs.
      # Default `npx playwright install` would pull Firefox + WebKit too,
      # roughly tripling the download. The runner only spins up Chromium.
      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Accessibility audit (axe-core over every Storybook story)
        run: npm run check-a11y

      - name: Token enforcement
        run: npm run check-tokens

      - name: Strings-module enforcement
        run: npm run check-strings

      - name: Contrast audit (WCAG AA over token pairs, both themes)
        run: npm run check-contrast

      # Storybook is the ONLY automated rendered component/a11y surface here
      # (vitest is node-env, there are no *.test.tsx), and check-a11y can only
      # audit a component that has a story. The gate rejects new uncovered
      # modules; three older component exceptions (one UI primitive, two
      # composed) and 33 older feature components remain a frozen baseline in
      # check-stories.ts.
      - name: Storybook coverage (no new uncovered components)
        run: npm run check-stories

      # Compatibility surfaces (CLAUDE.md). Both of these guard a mistake
      # whose blast radius is a friend's already-installed copy, and both are
      # invisible on a fresh checkout — exactly the class that needs CI.
      - name: Forward-only migration guard
        run: npm run check-migrations

      # Not release-time-only: a PR that bumps package.json but forgets
      # Cargo.toml sits on main looking fine until release.yml's preflight
      # rejects the tag — after release-prep has already pushed it. Catching
      # the partial bump on the PR costs nothing and saves burning a version.
      - name: Version lockstep across the five tracked files
        run: bash scripts/check-version-lockstep.sh "$(node -p "require('./package.json').version")"

  third-party-notices:
    name: Third-party notice closure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; the toolchain input selects the channel
        with:
          toolchain: '1.97.1'

      # The generator itself is network-free. Populate Cargo's cache from the
      # exact lock first so it can traverse and read the three target-specific
      # crate closures with `cargo metadata --locked --offline`.
      - name: Fetch locked Cargo release closures
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu
          # Cargo's platform fetch can omit a package that is selected through
          # a nested Windows cfg. Fetch the complete locked graph as well so
          # the subsequent, deliberately offline metadata pass is complete.
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Verify committed third-party notices
        run: npm run check-notices

  rust:
    name: Rust (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # PR-17 — compile every host in the release matrix on every push/PR. Building
      # only aarch64-apple-darwin left every #[cfg(target_os = "windows")] path
      # (custom-chrome set_decorations, the sidecar PATH block, the
      # windows-native keyring backend) uncompiled until release.yml's
      # windows-latest job — which runs AFTER release-prep has already pushed
      # the vX.Y.Z tag, so a Windows-only break burned a version.
      #
      # Linux is a release-candidate target too: the identity/keyring command
      # surface must compile on Linux, and an uncompiled platform is one nobody
      # notices breaking.
      # Without this leg the whole `cfg(target_os = "linux")` keyring block
      # would be verified only on a maintainer's dev box.
      fail-fast: false
      matrix:
        include:
          - label: macOS
            os: macos-latest
            llama-triple: aarch64-apple-darwin
          - label: Windows
            os: windows-latest
            llama-triple: x86_64-pc-windows-msvc
          - label: Linux
            os: ubuntu-latest
            llama-triple: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Tauri's Linux build needs the WebKitGTK/GTK development headers, which
      # the macOS and Windows runners get from their own SDKs. libdbus-1-dev is
      # ours specifically: keyring's `sync-secret-service` backend links libdbus
      # to reach org.freedesktop.secrets (src-tauri/Cargo.toml).
      #
      # This matrix leg compiles the keychain backend. The packaged AppImage job
      # below separately starts gnome-keyring on an isolated session bus,
      # performs a Secret Service round-trip, and launches the built artifact.
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev build-essential file

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; the toolchain input selects the channel
        with:
          # With a master pin the ref no longer selects the toolchain; this
          # input does.
          toolchain: '1.97.1'
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target

      # tauri.conf.json's bundle.externalBin entry requires the file to exist on
      # disk during the cargo build script (V2-P1). Each runner is its own host
      # triple (macos-latest = Apple Silicon, windows-latest = x86_64-msvc), so
      # cargo check/test build natively for the matrix target. `shell: bash`
      # runs the fetch script identically on the Windows runner.
      - name: Fetch llama-server prebuild
        shell: bash
        run: bash scripts/fetch-llama-server.sh --triple ${{ matrix.llama-triple }}

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo clippy (correctness only)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -A clippy::all -D clippy::correctness

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # The gate above allows every clippy group except correctness, so
      # `suspicious`, `complexity`, and `perf` findings — the ones that catch
      # a real mistake rather than a style preference — have never been seen.
      # Nobody knows how large that backlog is: this box cannot compile the
      # Tauri crate, so the only way to find out is to measure it in CI.
      #
      # Non-blocking on purpose, and it should stay that way until the count
      # is known and burned down; then promote the groups that reach zero
      # into the blocking step above. Reuses the same warm cargo cache, so it
      # costs seconds rather than a second full build.
      - name: cargo clippy (advisory — measuring the wider lint backlog)
        continue-on-error: true
        working-directory: src-tauri
        shell: bash
        run: |
          set -uo pipefail
          cargo clippy --all-targets --message-format short -- \
            -A clippy::all \
            -W clippy::suspicious -W clippy::complexity -W clippy::perf \
            2>&1 | tee clippy.log || true
          count=$(grep -c 'warning:' clippy.log || true)
          {
            echo "### clippy backlog — ${{ matrix.label }}"
            echo
            echo "\`suspicious\` + \`complexity\` + \`perf\`: **${count:-0}** warning(s)."
            echo
            echo "Advisory. Promote a group into the blocking step in ci.yml once it reaches zero."
          } >> "$GITHUB_STEP_SUMMARY"

  linux-appimage:
    name: Linux AppImage startup smoke
    runs-on: ubuntu-22.04
    # A cache miss compiles WebKitGTK itself. Keep the hard ceiling large
    # enough for that fail-safe path rather than making the cache mandatory.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # WebKit's unified C++ build cannot share the stock runner's small free
      # partition with the unused hosted Android/.NET/Haskell/Swift/CodeQL
      # toolchains and container images. The directories are fixed paths on
      # this disposable Linux runner, and the job uses no containers.
      - name: Reclaim runner disk for a cold WebKitGTK build
        run: |
          df -h /
          sudo rm -rf -- \
            /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift \
            /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      # Build and launch the same portable artifact Linux users receive. The
      # GStreamer packages are intentionally present at bundle time so
      # AppImage's media-framework bundling can carry WebRTC playback support.
      # The -dev set is the Jammy WebKitGTK source-build surface for the GTK3 /
      # Soup3 / GStreamer configuration selected by the pinned build script.
      - name: Install WebKitGTK build, packaging, and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake binutils=2.38-4ubuntu2.12 build-essential bison \
            bubblewrap ca-certificates clang-14=1:14.0.0-1ubuntu1.1 cmake curl dbus-x11 \
            desktop-file-utils file flex g++-12 gcc-11=11.4.0-1ubuntu1~22.04.3 gcc-12 gettext gnome-keyring \
            gperf libayatana-appindicator3-dev \
            libcairo2-dev libdbus-1-dev libdrm-dev libegl-dev \
            libenchant-2-dev libepoxy-dev libfontconfig-dev libfreetype-dev \
            libfuse2 libgbm-dev libgcc-11-dev=11.4.0-1ubuntu1~22.04.3 libgcrypt20-dev libgl-dev libgles-dev libglib2.0-dev \
            libglib2.0-dev-bin libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libgtk-3-dev libgudev-1.0-dev libharfbuzz-dev libhyphen-dev \
            libicu-dev libjpeg-dev liblcms2-dev libnice-dev libopenjp2-7-dev \
            libpng-dev librsvg2-dev libseccomp-dev libunwind-dev \
            libsecret-1-dev libsecret-tools libsoup-3.0-dev libsqlite3-dev \
            libssl-dev libsysprof-capture-4-dev libsystemd-dev \
            libtasn1-6-dev libwayland-dev libwebkit2gtk-4.1-dev libwebp-dev \
            libwoff-dev libx11-dev libxcomposite-dev libxdo-dev libxml2-dev \
            libxml2-utils libxslt1-dev libxt-dev \
            libtool ninja-build patch patchelf perl pkg-config python3 ruby tar \
            unifdef wayland-protocols xauth xdg-dbus-proxy xdg-utils xz-utils xvfb \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-nice gstreamer1.0-pipewire gstreamer1.0-tools

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; the toolchain input selects the channel
        with:
          toolchain: '1.97.1'

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Configure the pinned WebKitGTK runtime prefix
        id: webkit-runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -v PKG_CONFIG_SYSROOT_DIR ]]; then
            echo "::error::PKG_CONFIG_SYSROOT_DIR must be unset for the mixed runtime/system dependency graph"
            exit 1
          fi
          # shellcheck source=scripts/linux-webkit-runtime.env
          source scripts/linux-webkit-runtime.env
          export STUDYVIS_WEBKIT_RUNTIME_DIR="${RUNNER_TEMP}/studyvis-webkit-runtime"
          export STUDYVIS_WEBKIT_BUILD_DIR="${RUNNER_TEMP}/studyvis-webkit-build"
          runtime_dir=$(bash scripts/build-linux-webkit-runtime.sh --print-prefix)
          runtime_pkgconfig=$(bash scripts/build-linux-webkit-runtime.sh --print-pkg-config-path)
          runtime_lib=${runtime_pkgconfig%/pkgconfig}
          {
            echo "STUDYVIS_WEBKIT_RUNTIME_DIR=${runtime_dir}"
            echo "STUDYVIS_WEBKIT_BUILD_DIR=${STUDYVIS_WEBKIT_BUILD_DIR}"
            echo "STUDYVIS_CARGO_C_VERSION=${STUDYVIS_CARGO_C_VERSION}"
            echo "PKG_CONFIG_PATH=${runtime_pkgconfig}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
            echo "LD_LIBRARY_PATH=${runtime_lib}:${GITHUB_WORKSPACE}/src-tauri/binaries/llama-runtime-x86_64-unknown-linux-gnu${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          } >> "$GITHUB_ENV"
          {
            echo "runtime-dir=${runtime_dir}"
            echo "cargo-c-version=${STUDYVIS_CARGO_C_VERSION}"
          } >> "$GITHUB_OUTPUT"

      # Cache only the installed runtime, never the source/build tree. The key
      # covers the supply-chain tuple, effective build logic, and portability
      # patch. The build step still runs on a hit and validates completeness,
      # so an absent or partial cache safely falls back to a cold build.
      - name: Restore pinned WebKitGTK runtime
        id: webkit-runtime-cache
        uses: actions/cache@v5
        with:
          path: ${{ steps.webkit-runtime.outputs.runtime-dir }}
          key: studyvis-webkitgtk-jammy-x86_64-rust-1.97.1-cargo-c-${{ steps.webkit-runtime.outputs.cargo-c-version }}-${{ hashFiles('scripts/linux-webkit-runtime.env', 'scripts/build-linux-webkit-runtime.sh', 'scripts/generate-librice-third-party-notices.mjs', 'scripts/patches/*.patch') }}

      - name: Install pinned cargo-c
        run: |
          set -euo pipefail
          cargo install cargo-c --version "=${STUDYVIS_CARGO_C_VERSION}" --locked
          cargo_c_output=$(cargo cinstall --version)
          case "$cargo_c_output" in
            *" ${STUDYVIS_CARGO_C_VERSION}"|*" ${STUDYVIS_CARGO_C_VERSION}+"*) ;;
            *) echo "Unexpected cargo-c version: $cargo_c_output" >&2; exit 1 ;;
          esac

      - name: Build or verify the pinned WebKitGTK runtime
        run: bash scripts/build-linux-webkit-runtime.sh

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch llama-server prebuild
        run: bash scripts/fetch-llama-server.sh --triple x86_64-unknown-linux-gnu

      - name: Exercise the StudyVis Secret Service backend
        working-directory: src-tauri
        shell: bash
        run: |
          # The nested Bash process intentionally expands the single-quoted variables.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -euo pipefail -c '
            keyring_data=$(mktemp -d "${RUNNER_TEMP}/studyvis-keyring.XXXXXX")
            chmod 700 "$keyring_data"
            export XDG_DATA_HOME="$keyring_data"
            printf "studyvis-ci\n" | gnome-keyring-daemon \
              --components=secrets --daemonize --unlock
            cargo test --locked \
              commands::identity::tests::secret_service_round_trip -- \
              --ignored --exact --nocapture
          '

      - name: Prepare the pinned linuxdeploy toolchain
        shell: bash
        env:
          TOOL_CACHE_HOME: ${{ runner.temp }}/studyvis-tauri-cache-ci
        run: |
          set -euo pipefail
          bash scripts/prepare-linuxdeploy-tools.sh "$TOOL_CACHE_HOME"
          {
            echo "XDG_CACHE_HOME=$TOOL_CACHE_HOME"
            echo "LDAI_RUNTIME_FILE=$TOOL_CACHE_HOME/studyvis-appimage-runtime-r1/runtime-x86_64"
            echo "GSTREAMER_PLUGINS_DIR=$GITHUB_WORKSPACE/src-tauri/target/appimage-webkit/gstreamer-plugins"
            echo "GSTREAMER_HELPERS_DIR=$GITHUB_WORKSPACE/src-tauri/target/appimage-webkit/gstreamer"
          } >> "$GITHUB_ENV"

      - name: Build unsigned AppImage without updater artifacts
        run: |
          version=$(node -p "require('./package.json').version")
          appimage="${GITHUB_WORKSPACE}/src-tauri/target/release/bundle/appimage/StudyVis_${version}_amd64.AppImage"
          # rust-cache restores target/. Remove only the exact output this
          # build must recreate, so a stale same-version bundle cannot satisfy
          # the assertions when packaging silently stops producing output.
          rm -f "$appimage"
          npm run tauri -- build --bundles appimage \
            --config '{"bundle":{"createUpdaterArtifacts":false,"linux":{"appimage":{"bundleMediaFramework":true}}}}'
          test -f "$appimage"
          echo "APPIMAGE_PATH=$appimage" >> "$GITHUB_ENV"

      - name: Assert packaged WebKit, PipeWire, and AI runtimes
        shell: bash
        run: |
          bash scripts/check-linux-appimage.sh "$APPIMAGE_PATH"

      - name: Launch the packaged AppImage under Xvfb
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/appimage-startup.log"
          smoke_data=$(mktemp -d "${RUNNER_TEMP}/studyvis-app-data.XXXXXX")
          export APPIMAGE="$APPIMAGE_PATH"
          export SMOKE_DATA="$smoke_data"
          set +e
          # The nested Bash process intentionally expands the single-quoted variables.
          # shellcheck disable=SC2016
          timeout --signal=TERM --kill-after=5s 20s \
            dbus-run-session -- bash -euo pipefail -c '
              chmod 700 "$SMOKE_DATA"
              export XDG_DATA_HOME="$SMOKE_DATA"
              printf "studyvis-ci\n" | gnome-keyring-daemon \
                --components=secrets --daemonize --unlock
              secret="studyvis-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              printf "%s" "$secret" | secret-tool store \
                --label="StudyVis CI Secret Service smoke" \
                application studyvis purpose packaged-smoke
              recovered=$(secret-tool lookup \
                application studyvis purpose packaged-smoke)
              if [ "$recovered" != "$secret" ]; then
                echo "Secret Service returned the wrong value" >&2
                exit 1
              fi
              secret-tool clear application studyvis purpose packaged-smoke
              echo "Secret Service round-trip passed."
              # Do not let the build-only loader path mask a missing library in
              # the AppImage: AppRun must supply its own staged dependencies.
              exec xvfb-run -a env -u LD_LIBRARY_PATH \
                APPIMAGE_EXTRACT_AND_RUN=1 \
                WEBKIT_DISABLE_COMPOSITING_MODE=1 \
                "$APPIMAGE"
            ' >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if ! grep -Fqx 'Secret Service round-trip passed.' "$log"; then
            echo "::error::Secret Service round-trip did not complete before the packaged-app smoke"
            exit 1
          fi
          if [ "$status" -ne 124 ]; then
            echo "::error::Packaged AppImage did not stay alive for the 20-second startup smoke (exit $status)"
            exit 1
          fi
          runtime_log="$smoke_data/studyvis/logs/studyvis.log"
          if ! grep -F '"scope":"runtime.webrtc","msg":"ready"' "$runtime_log"; then
            echo "::error::The first packaged StudyVis document did not complete a WebRTC data-channel offer"
            exit 1
          fi
          echo "Packaged AppImage stayed alive and attested a first-document WebRTC data-channel offer."

  # ---------------------------------------------------------------------
  # Everything below is new pre-merge surface (#102). Each job is cheap and
  # independent, so they fan out beside the two slow ones above rather than
  # lengthening them; `all-green` at the bottom is the single check branch
  # protection needs to require.
  # ---------------------------------------------------------------------

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # The advisory pass uploads SARIF so the low-confidence findings live
      # in the Security tab instead of reddening a merge.
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # actionlint catches the boring-but-real class: a typo'd `runs-on`, an
      # expression that cannot type-check, a `run:` block shellcheck can
      # prove wrong. Those fail a workflow at dispatch time — which for
      # release.yml means discovering it after the version tag is pushed.
      #
      # Installed from the release tarball with its published checksum
      # verified before extraction rather than via a third-party action:
      # this step is a binary download into the job that audits the release
      # pipeline, so "which bytes ran" should not depend on a marketplace
      # action's own supply chain. Bump VERSION and SHA256 together — the
      # checksum comes from actionlint_<version>_checksums.txt on the
      # release. Dependabot does not manage this one; the version is
      # deliberately in one obvious place.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar xzf "$tarball" actionlint
          ./actionlint -color

      # zizmor is the security-shaped half: template injection, credential
      # persistence, over-broad permissions, and — the one that matters most
      # here — unpinned third-party actions. .github/zizmor.yml encodes this
      # repo's actual policy (github-owned on major tags, everything else
      # hash-pinned), so this step is the machine-checkable form of the
      # paragraph at the top of this file.
      #
      # Blocking at high severity AND high confidence. That is verified
      # green on the current tree and, in practice, is exactly the pinning
      # policy; the heuristic audits below it would gate merges on
      # low-confidence guesses, which is how a gate gets ignored.
      - name: zizmor (blocking — pinning policy)
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          version: 1.28.0
          config: .github/zizmor.yml
          min-severity: high
          min-confidence: high
          advanced-security: false
          annotations: true
          inputs: .github/workflows/

      # Second pass, everything zizmor has to say, into the Security tab.
      # Non-blocking by construction: findings become code-scanning alerts to
      # triage, not a red X on an unrelated PR.
      - name: zizmor (advisory — full findings to code scanning)
        continue-on-error: true
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          version: 1.28.0
          config: .github/zizmor.yml
          persona: pedantic
          advanced-security: true
          inputs: .github/workflows/

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The gate that can be strict without being red on day one: it scores
      # only what THIS pull request adds to the dependency graph, so the
      # pre-existing advisory backlog (ISSUES.md I19) does not block unrelated
      # work while a newly-introduced vulnerable package still fails.
      #
      # PR-only: on a push to main there is no base to diff against.
      - name: Dependency review (new vulnerabilities in this diff)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Vulnerabilities only — no allow-licenses/deny-licenses is set, so
          # this step scores no licences at all. npm licences are deliberately
          # unguarded for now; the Rust side has a real allowlist in
          # src-tauri/deny.toml because that graph ends up inside the signed
          # binary. Do not read this step as licence coverage.
          comment-summary-in-pr: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The whole-graph npm picture, deliberately NON-blocking. `npm audit`
      # is red on this repo today and has been since ISSUES.md I19 logged it:
      # the findings are dev-chain (storybook's test-runner pulling nyc /
      # jest-junit) plus react-router advisories that are all SSR/server-route
      # issues in an app with no server. Making it blocking would train the
      # one maintainer to merge past a red X, which costs more than it buys.
      # It lands in the job summary so the backlog stays visible instead.
      - name: npm audit (advisory)
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            echo "### npm audit"
            echo
            echo '```'
            npm audit --audit-level=high 2>&1 | tail -40 || true
            echo '```'
            echo
            echo "_Advisory only — see ISSUES.md I19. Blocking gate is"
            echo "dependency-review, which scores only what this PR adds._"
          } >> "$GITHUB_STEP_SUMMARY"

      # Rust had no supply-chain gate at all: `cargo check --locked` proves
      # the lockfile is honoured, not that anything in it is safe. deny.toml
      # is derived from the real 629-package graph and is verified green, so
      # this one blocks. It reads manifests only — no compile, no
      # webkit2gtk/WebView2 prerequisites, ~30s on a cold runner.
      #
      # The three inputs are not interchangeable — the action assembles
      # `cargo-deny <arguments> <command> <command-arguments>`, so the check
      # list belongs in command-arguments and only global options go in
      # `arguments`. Overriding `arguments` also drops its `--all-features`
      # default on purpose: deny.toml sets `all-features = false`, and the
      # CLI flag would override the config and audit a different graph than
      # the one verified locally.
      - name: cargo-deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: '1.97.1'
          manifest-path: src-tauri/Cargo.toml
          arguments: --config src-tauri/deny.toml
          command: check
          command-arguments: advisories licenses bans sources

  hygiene:
    name: Docs & copy hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Blocking, and green on the current tree with the allowlist in
      # _typos.toml. It earns the gate mainly because of src/strings.ts:
      # that file is every toast and notification a friend ever reads, it
      # ships inside the binary, and a typo there survives until the next
      # release.
      - name: Spell check
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

      # Advisory: link rot is real (INSTALL.md and README.md both point at
      # tauri.app and GitHub release URLs) but it is caused by other people's
      # sites moving, so it must never be the reason a code PR cannot merge.
      # `--no-progress` keeps the log readable; failures land in the summary.
      - name: Link check (advisory)
        continue-on-error: true
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 4
            --accept 200,206,403,429
            --exclude-path node_modules
            --exclude-path dist
            --exclude-path storybook-static
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude 'studyvis://'
            './**/*.md'
          fail: false
          jobSummary: true

  all-green:
    name: All pre-merge checks
    # The single check to require in branch protection: one rule to
    # configure, instead of re-editing it every time a job is added. The
    # `needs:` list below is the part that IS hand-maintained.
    # !cancelled(), not always(): always() is true even for a CANCELLED run,
    # and with cancel-in-progress on (line 11) every superseded push would
    # spin this job up, read 'cancelled' from every need, and report a hard
    # failure for a run nobody was waiting on.
    if: ${{ !cancelled() }}
    # Hand-maintained on purpose, and the one line to update when adding a
    # job to this file — a job missing from here is a job branch protection
    # does not gate on.
    needs:
      [
        frontend,
        third-party-notices,
        rust,
        linux-appimage,
        workflows,
        supply-chain,
        hygiene,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Assert every gate above succeeded
        env:
          # Via env, not inlined into the script: `${{ toJSON(needs) }}`
          # interpolated straight into a run block is the template-injection
          # shape zizmor exists to catch, and this file is the example the
          # rest of the repo copies from.
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' | sort
          # Every job named in `needs` is unconditional, so anything other
          # than success is a failed aggregate gate. Keeping this fail-closed
          # also prevents a future job-level condition from silently turning
          # a required check green by returning `skipped`.
          failed=$(echo "$NEEDS" | jq -r '
            [to_entries[] | select(.value.result != "success") | .key]
            | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::pre-merge gates did not pass: $failed"
            exit 1
          fi
          echo "All pre-merge gates passed."
