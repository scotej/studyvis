name: PR 191 remediation on reopen v3

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'feat/session-image-sharing-185'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/session-image-sharing-185
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Apply targeted fixes
        run: |
          python scripts/pr-191-remediate.py
          python scripts/pr-191-remediate-fix.py
          python scripts/pr-191-remediate-fix-v3.py

      - name: Install dependencies
        run: npm ci

      - name: Format
        run: npm run format

      - name: Frontend gates
        run: |
          npm run build
          npm run lint
          npm run test
          npm run check-tokens
          npm run check-strings
          npm run check-migrations
          npm run check-stories
          npm run check-contrast
          npm run build-storybook
          npm run check-a11y

      - name: Rust gates
        working-directory: src-tauri
        run: |
          cargo test
          cargo fmt --check
          cargo clippy
          cargo deny check

      - name: Commit remediation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: address image sharing review findings"
          git push origin HEAD:feat/session-image-sharing-185
