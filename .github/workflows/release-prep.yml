name: Release prep

# One-click release cutting. Bumps the version across all five tracked files,
# commits + tags on main, and lets the tag push trigger the Release build
# (which produces a draft GitHub Release). Run from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Version bump'
        type: choice
        options: [patch, minor, major, custom]
        default: patch
      custom_version:
        description: 'Exact version, e.g. 1.2.0 or 1.2.0-rc.1 (only used when bump = custom)'
        type: string
        default: ''

# Job-scoped (not workflow-level) so the gate job — which runs the
# third-party toolchain action — never holds a write token; only prep pushes
# the bump commit + tag. Third-party actions are
# SHA-pinned; see ci.yml's pinning note.
permissions:
  contents: read

concurrency:
  group: release-prep
  cancel-in-progress: false

jobs:
  # Quality gate over main before anything is bumped, committed, tagged, or
  # pushed. rustfmt is the only Rust check here — no compilation, so the
  # ubuntu runner needs no llama-server prebuild.
  gate:
    permissions:
      contents: read
      actions: read # the "Require CI success" step queries the runs API
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verified-sha: ${{ steps.ci-check.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # The gate job only reads; the `prep` job below is the one that
          # pushes the bump commit and tag, and keeps its credential.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Type-check + Vite build
        run: npm run build

      - name: Token enforcement
        run: npm run check-tokens

      - name: Strings-module enforcement
        run: npm run check-strings

      - name: Contrast (WCAG AA) enforcement
        run: npm run check-contrast

      # #47 C4 — non-blocking: dead pinned relays degrade default-config
      # discovery for every install at once, and fixing the list means
      # shipping a release — so surface rot at exactly the moment a release
      # is being cut, without gating on third-party relay uptime.
      - name: Signaling-relay health (non-blocking)
        continue-on-error: true
        run: npm run check-relays

      # PR-19 — the a11y gate (a CLAUDE.md quality gate that ci.yml runs) was
      # missing here, so a release could be cut over an axe-core regression.
      - name: Storybook build
        run: npm run build-storybook

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Accessibility audit (axe-core over every Storybook story)
        run: npm run check-a11y

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; the toolchain input selects the channel
        with:
          # With a master pin the ref no longer selects the toolchain; this
          # input does.
          toolchain: '1.97.1'
          components: rustfmt

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      # PR-19 — compiling the Rust targets (macOS, Windows, and Linux) on this
      # ubuntu gate is impractical, and shipping a release over a clippy or
      # cargo-test failure the pre-commit hook can silently miss is the exact
      # gap this closes. Require that CI (which DOES compile/clippy/test every
      # host targets and runs check-a11y) has gone green on the precise main SHA
      # being tagged, so the irreversible bump+tag+push can't outrun it.
      # Same reasoning as release.yml's signing-key preflight: a missing
      # secret that only surfaces later reads as a mysterious failure. Without
      # RELEASE_PAT the `prep` job below runs the whole bump, then dies on
      # `git push origin main` with a rules violation that looks like a
      # protection misconfiguration rather than an absent secret. Only
      # presence is checked; the value never reaches the log.
      - name: Assert the release PAT is configured
        env:
          PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${PAT}" ]]; then
            echo "::error::RELEASE_PAT is not set. main is protected by a ruleset requiring a PR + 'All pre-merge checks', and GITHUB_TOKEN cannot bypass it on a user-owned repo. Create a fine-grained PAT scoped to this repository with Contents: read and write, add it as the RELEASE_PAT secret, and re-run."
            exit 1
          fi

      - name: Require CI success on this main commit
        id: ci-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Requiring a successful CI run for main @ $sha"
          response=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$sha&per_page=10" \
            2>/dev/null || printf '{"workflow_runs":[]}')
          run=$(jq -r --arg sha "$sha" '
            [.workflow_runs[] | select(.head_sha == $sha)]
            | sort_by(.run_number) | last
            | if . == null then "none" else "\(.status):\(.conclusion // "")" end
          ' <<< "$response")
          echo "CI run for $sha: $run"
          if [ "$run" != "completed:success" ]; then
            echo "::error::CI has not passed on main @ $sha (got '$run'). Push the fix, wait for CI to go green, then re-run Release prep."
            exit 1
          fi

  prep:
    permissions:
      # The persisted RELEASE_PAT below performs both pushes. Keep the separate
      # GITHUB_TOKEN read-only so the job holds only one write credential.
      contents: read
    name: Bump and tag
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # RELEASE_PAT, not GITHUB_TOKEN. main is protected by a ruleset that
      # requires a pull request and the "All pre-merge checks" status check,
      # and a ruleset evaluates a direct push from Actions the same as any
      # other — the bump commit has no PR and no CI run of its own, so
      # GITHUB_TOKEN's push is rejected outright (verified against a probe
      # branch: "Changes must be made through a pull request").
      #
      # A repository-owner PAT is what gets through. Both the main ruleset and
      # the required refs/tags/v* ruleset need the same sole Always-bypass
      # entry: RepositoryRole 5 (admin). Integration bypass — which would have
      # let GITHUB_TOKEN through directly — is not offered on a user-owned
      # repository, only inside an organization.
      #
      # Scope it as narrowly as GitHub allows: a fine-grained PAT limited to
      # this repository with Contents: read and write. Nothing else.
      # persist-credentials stays ON here (unlike every other checkout in
      # this repo) because the pushes below need the credential on disk.
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_PAT }}

      # Pin the release to the EXACT SHA the gate verified. `ref: main` above
      # can resolve to a newer commit if main advanced between the gate and prep
      # checkouts, which would bump+tag+release code CI never approved (TOCTOU).
      # Fail fast rather than release an unverified commit; the user re-runs
      # Release prep, which re-gates the new HEAD.
      - name: Verify checkout matches gate-verified SHA
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          verified='${{ needs.gate.outputs.verified-sha }}'
          echo "prep HEAD: $head; gate-verified: $verified"
          if [ "$head" != "$verified" ]; then
            echo "::error::main advanced since the gate verified $verified (now $head). Re-run Release prep."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Compute next version
        id: ver
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          IFS='.' read -r MA MI PA <<< "$current"
          case "$RELEASE_TYPE" in
            major)  NEW="$((MA + 1)).0.0" ;;
            minor)  NEW="${MA}.$((MI + 1)).0" ;;
            patch)  NEW="${MA}.${MI}.$((PA + 1))" ;;
            custom) NEW="$CUSTOM_VERSION" ;;
            *)      echo "::error::unknown release_type '$RELEASE_TYPE'"; exit 1 ;;
          esac
          if [[ ! "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::computed version '$NEW' is not X.Y.Z or X.Y.Z-prerelease (custom needs a value)"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW" >/dev/null 2>&1; then
            echo "::error::tag v$NEW already exists on origin"; exit 1
          fi
          echo "Bumping $current -> $NEW"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      # #47 F2 — CLAUDE.md requires a CHANGELOG entry per release and the
      # Releases page is the update channel friends actually read, but nothing
      # enforced it: every draft shipped with static install boilerplate only.
      # Fail BEFORE the irreversible bump+tag+push. Shares one extraction
      # script with release.yml's preflight (heading present AND non-empty
      # body) so the two gates cannot drift: a heading-only placeholder
      # passing here but failing there would strand a pushed tag + bump
      # commit with no release — exactly the drift class #74 already fixed
      # by hand once.
      - name: Require a non-empty CHANGELOG section for the new version
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          bash scripts/changelog-section.sh "$NEW" \
            "Write the release notes, merge to main, then re-run Release prep." \
            > /dev/null

      - name: Bump version in all five files
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          # package.json + package-lock.json (both lock entries) in one shot.
          npm version "$NEW" --no-git-tag-version --allow-same-version
          # tauri.conf.json: the single top-level "version".
          perl -0pi -e 's/("version":\s*)"[^"]*"/$1"$ENV{NEW}"/' src-tauri/tauri.conf.json
          # Cargo.toml: only the version inside the [package] table.
          perl -0pi -e 's/(\[package\][^\[]*?\nversion\s*=\s*)"[^"]*"/$1"$ENV{NEW}"/s' src-tauri/Cargo.toml
          # Cargo.lock: the studyvis package's own entry.
          perl -0pi -e 's/(name = "studyvis"\nversion = )"[^"]*"/$1"$ENV{NEW}"/' src-tauri/Cargo.lock
          echo "Changed files:" && git --no-pager diff --name-only

      # #47 F1 — `perl -0pi` exits 0 whether or not its pattern matched, so a
      # regex drift would bake a silent partial bump into a version tag.
      # Re-read all five files and require the bump actually landed.
      - name: Verify the bump landed in all five files
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: bash scripts/check-version-lockstep.sh "$NEW"

      - name: Commit, tag, push
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json \
                  src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/Cargo.lock
          git commit -m "chore(release): v$NEW"
          git tag -a "v$NEW" -m "StudyVis v$NEW"
          # Push the commit and its annotated tag in one transaction. A
          # main-only push followed by a rejected tag would leave version
          # metadata advanced with no releasable ref.
          if ! git push --atomic origin main "v$NEW"; then
            echo "::error::Atomic release push failed. If GitHub reported a ruleset violation, verify both main and refs/tags/v* rulesets have only an Always RepositoryRole 5 (admin) bypass and that RELEASE_PAT belongs to the repository owner/admin with Contents read+write."
            exit 1
          fi

      - name: Summary
        if: always()
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          {
            echo "### Release prep: v${NEW:-?}"
            echo ""
            echo "- Bumped version to **v${NEW}** and pushed tag \`v${NEW}\` to main"
            echo "- The RELEASE_PAT tag push triggers the **Release** build once"
            echo ""
            echo 'After the draft verifies, run **Publish verified release** for `v'"${NEW}"'`:'
            echo "<https://github.com/${{ github.repository }}/actions/workflows/publish-release.yml>"
          } >> "$GITHUB_STEP_SUMMARY"
