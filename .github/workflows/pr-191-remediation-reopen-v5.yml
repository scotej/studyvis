name: PR 191 one-shot deployment fix

on:
  push:
    branches:
      - feat/session-image-sharing-185
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-191-one-shot-deployment-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/session-image-sharing-185
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix TypeScript and remove temporary remediation files
        shell: python
        run: |
          from pathlib import Path

          source = Path('src/features/session/images.ts')
          text = source.read_text()
          old = '  let offset = PNG_SIGNATURE.length\n'
          new = '  let offset: number = PNG_SIGNATURE.length\n'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one PNG offset declaration, found {text.count(old)}')
          source.write_text(text.replace(old, new))

          temporary_files = [
              '.github/workflows/pr-191-remediation-reopen-v2.yml',
              '.github/workflows/pr-191-remediation-reopen-v3.yml',
              '.github/workflows/pr-191-remediation-reopen-v4.yml',
              '.github/workflows/pr-191-remediation-reopen-v5.yml',
              '.github/workflows/pr-191-remediation-reopen.yml',
              '.github/workflows/pr-191-remediation.yml',
              'scripts/pr-191-remediate-fix-v3.py',
              'scripts/pr-191-remediate-fix-v4.py',
              'scripts/pr-191-remediate-fix-v5.py',
              'scripts/pr-191-remediate-fix.py',
              'scripts/pr-191-remediate.py',
          ]
          for filename in temporary_files:
              Path(filename).unlink(missing_ok=True)

      - name: Format fixed source
        run: npx prettier --write src/features/session/images.ts

      - name: Validate deployment build
        run: |
          npm run format:check
          npm run lint
          npm run build

      - name: Commit fix and cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: restore PR deployment checks"
          git push origin HEAD:feat/session-image-sharing-185
