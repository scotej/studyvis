name: Deploy

# AN INDICATOR, NOT A GATE. Nothing waits for this workflow.
#
# Read this before adding `Deployed` to branch protection: it is not meant to
# be there. CI now gates a real Linux AppImage build/startup smoke, but this
# workflow additionally spends ~30-60 minutes each on the macOS and Windows
# preview installers. Merging waits on `All pre-merge checks` (ci.yml) and
# `PR title` (pr-title.yml); those two remain the only required checks. This
# workflow runs alongside them and reports: green means the commit produced
# installable previews for macOS, Windows, and the Linux release candidate; red
# means a release-matrix platform stopped packaging. It remains an indicator,
# not an additional required check.
#
# So a red `Deployed` is information, not a blocker. Look at it before you
# merge if the change is shippable; act on it when it is red; never sit and
# wait for it. If it turns out to catch things often enough to be worth the
# wall-clock, promoting it to required is a one-line ruleset edit — that is a
# deliberate future decision, not the current setup.
#
# What it actually does: every commit that reaches a pull request or main is
# built into a real, installable StudyVis bundle for each release-matrix
# platform from that exact SHA, published as the run's artifacts, and recorded
# as a GitHub Deployment — one per platform, to `preview-macos`,
# `preview-windows`, and `preview-linux`, because the artifacts succeed and
# fail independently.
#
# This replaces .github/workflows/pr-build.yml ("PR installers"), which ran
# the same build behind a `build-installers` label. The reasoning for that
# label was sound and is kept — a full Tauri build is expensive and most PRs
# here are docs or CI — but it is now encoded as the `scope` job below rather
# than left to whoever remembers to apply a label. A change that touches no
# shippable file is deployed as a docs-only change; everything else builds.
# What is gone is having to opt IN: a shippable change now always gets its
# bundle, whether or not anyone thought to ask for one.
#
# Why this matters more here than on a typical project: CI compiles, lints,
# builds, and launches a packaged Linux AppImage, but the things this
# app gets wrong most often — a camera stream that never reaches a late joiner,
# a sidecar that dies at session start — need two real builds talking to each
# other. Before this workflow, the first installable build of any change
# appeared AFTER release-prep had already pushed the version tag.
#
# These bundles are NOT releases. `createUpdaterArtifacts` is switched off
# below, so no `latest.json` is produced and nothing here can be mistaken
# for — or consumed by — the update channel (X6).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deliberately the same shape as ci.yml, including the activity types left at
# their defaults. #102 is the reason: an event that re-fires on an UNCHANGED
# commit (`edited`, `ready_for_review`) combines with cancel-in-progress to
# leave a `cancelled` required check beside a successful one on the same SHA,
# and the PR then sits at BLOCKED with everything green. Only opened /
# synchronize / reopened, all of which mean a new head commit to deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# See ci.yml's header: third-party actions are hash-pinned (enforced by the
# zizmor policy in .github/zizmor.yml), actions/* stay on major tags, and the
# workflow token is read-only. The deployment records come from the
# `environment:` key, which the Actions service mints on the job's behalf —
# no `deployments: write` is needed here.
permissions:
  contents: read

jobs:
  # Which surface does this commit actually change? A docs or CI-only commit
  # has no installable surface, and spending two hours of runner time to
  # produce a byte-identical bundle for it would make the gate something
  # people route around rather than something that catches breakage.
  scope:
    name: Deploy scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      installable: ${{ steps.classify.outputs.installable }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Pinned to the PR head, not left to default to `refs/pull/N/merge`
          # (PR #141 review). GitHub recomputes the merge ref whenever the base
          # branch moves, so two jobs in the same run can otherwise resolve it
          # to different trees — and the artifact this workflow hands you would
          # be a commit that exists in nobody's clone. Both checkouts in this
          # file use this identical expression; keep them in step.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The diff below needs the base commit reachable; a shallow clone
          # does not have it.
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change
        id: classify
        env:
          # Via env, never inlined into the script: a branch name is
          # attacker-controlled on a fork PR, and interpolating one straight
          # into a run block is the template-injection shape zizmor exists
          # to catch.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Any path NOT matched here is treated as shippable. The list is
          # deliberately an allowlist of things that cannot reach a user's
          # installed copy — err towards building.
          non_shippable='^(.*\.md|\.github/.*|\.gitignore|\.editorconfig|LICENSE.*|_typos\.toml)$'

          case "$EVENT_NAME" in
            pull_request) base="$BASE_SHA" ;;
            push)         base="$BEFORE_SHA" ;;
            *)            base='' ;;
          esac

          # workflow_dispatch has no diff, and a force-push or a branch's
          # first commit leaves `before` as the all-zero SHA. Both mean "we
          # cannot prove nothing shippable changed", which resolves to
          # building, not to skipping.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit — deploying the full installable surface."
            echo "installable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three dots, not two, and that is load-bearing now that HEAD is the
          # PR head rather than the merge commit. `git diff base HEAD` asks
          # "how do these two trees differ", so once the base branch moves
          # ahead of the branch point it reports the base's OWN new commits as
          # if this PR reverted them. Measured on this branch: two-dot claimed
          # 27 changed files (18 shippable) for a PR that had changed nothing,
          # which would build installers for every PR with a stale base.
          # `base...HEAD` diffs from the merge-base instead — the PR's own
          # changes, which is the question being asked.
          changed=$(git diff --name-only "$base...HEAD")
          shippable=$(printf '%s\n' "$changed" | grep -Ev "$non_shippable" || true)

          {
            echo "### Deploy scope"
            echo
            echo "\`$(printf '%s\n' "$changed" | grep -c . || true)\` file(s) changed since \`${base:0:7}\`."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$shippable" ]; then
            echo "installable=true" >> "$GITHUB_OUTPUT"
            {
              echo
              echo "Shippable files changed — building every release-matrix artifact:"
              echo
              echo '```'
              printf '%s\n' "$shippable" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "installable=false" >> "$GITHUB_OUTPUT"
            {
              echo
              echo "Docs/CI only — no installable surface changed, so no"
              echo "installer is built and this commit is deployed as a"
              echo "documentation change."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  installer:
    name: Installer (${{ matrix.label }})
    needs: scope
    runs-on: ${{ matrix.platform }}
    # macOS and Windows retain release.yml's 90-minute ceiling. Linux gets six
    # hours because a missing runtime cache deliberately falls back to compiling
    # WebKitGTK; the cache is an optimisation, never a packaging prerequisite.
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    # The guard is on the STEPS, not on the job, and that is deliberate — do
    # not "simplify" it back to a job-level `if:`. GitHub resolves a matrix
    # job's display name only when the job actually runs, so a leg skipped by
    # a job-level `if:` reports its check under the LITERAL, unexpanded name.
    # This job used to carry `if: needs.scope.outputs.installable == 'true'`
    # and every docs PR grew a check literally called
    # "Build ${{ matrix.label }}" — observed on PR #141, not theoretical.
    # Letting the job start and no-op costs ~20s of free public-repo runner
    # time and gives every platform a correctly-named, always-present
    # indicator instead.
    #
    # The cost of that choice: a docs-only commit still mints three deployment
    # records below, having built nothing. The step summary and the `Deployed`
    # rollup says so. Avoiding it would mean per-leg job outputs feeding
    # three extra statically-named jobs, which is a lot of machinery for three
    # rows in a low-traffic tab.
    env:
      SHIPPABLE: ${{ needs.scope.outputs.installable }}
    # One deployment record PER PLATFORM, minted here rather than on the
    # rollup job below. It has to be here: a matrix job's `result` collapses
    # every leg into a single value, so a job downstream of this one cannot
    # tell which platform broke from the collapsed result — it would mint one
    # deployment for three independent artifacts. Each leg deploying to its
    # own environment means the Deployments tab shows exactly what exists.
    environment:
      name: ${{ matrix.environment }}
      # No stable per-artifact URL exists at this point, so all point at the
      # run, which is where the download actually is.
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            arch: arm64
            environment: preview-macos
            platform: macos-latest
            timeout: 90
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            llama-triple: aarch64-apple-darwin
          - label: Windows
            arch: x64
            environment: preview-windows
            platform: windows-latest
            timeout: 90
            rust-targets: ''
            args: --bundles nsis
            llama-triple: x86_64-pc-windows-msvc
          - label: Linux
            arch: x64
            environment: preview-linux
            platform: ubuntu-24.04
            timeout: 360
            rust-targets: ''
            args: --bundles appimage
            llama-triple: x86_64-unknown-linux-gnu

    steps:
      # Green on a docs commit means "nothing needed building", not "the
      # installer is fine". Say so where someone reading the check will see it.
      # Every `run:` below takes its matrix values through `env:` rather than
      # `${{ }}` interpolation. These particular values are static literals in
      # this file, so neither form is exploitable — but zizmor flags the
      # interpolated shape on sight, and a workflow that mints installers
      # should not be teaching the pattern that a later, less static value
      # would follow.
      - name: Nothing to build
        if: env.SHIPPABLE != 'true'
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          {
            echo "### ${LABEL} installer"
            echo
            echo "Not built — this commit changes no shippable file."
          } >> "$GITHUB_STEP_SUMMARY"

      # `pull_request`, never `pull_request_target`: fork code runs with a
      # read-only token and no access to secrets, and nothing here needs
      # either. The artifact is an unsigned installer built from unreviewed
      # code — treat a fork PR's bundle accordingly before running it.
      - uses: actions/checkout@v7
        if: env.SHIPPABLE == 'true'
        with:
          # Same expression as the scope job's checkout — see the comment
          # there. The installer you download is built from the commit you
          # pushed, not from a merge ref that may have been recomputed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Reclaim runner disk for a cold WebKitGTK build
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf -- \
            /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift \
            /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Install WebKitGTK build and Linux packaging dependencies
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake binutils=2.42-4ubuntu2.10 build-essential bison \
            bubblewrap ca-certificates clang-14=1:14.0.6-19build4 cmake curl dbus-x11 \
            desktop-file-utils file flex g++-12 gcc-11=11.5.0-1ubuntu1~24.04.1 gcc-12 gettext \
            gperf libayatana-appindicator3-dev \
            libcairo2-dev libdbus-1-dev libdrm-dev libegl-dev \
            libenchant-2-dev libepoxy-dev libfontconfig-dev libfreetype-dev \
            libfuse2t64 libgbm-dev libgcc-11-dev=11.5.0-1ubuntu1~24.04.1 libgcrypt20-dev libgl-dev libgles-dev libglib2.0-dev \
            libglib2.0-dev-bin libgstreamer-plugins-bad1.0-dev \
            libgstreamer-plugins-base1.0-dev libgstreamer1.0-dev \
            libgtk-3-dev libgudev-1.0-dev libharfbuzz-dev libhyphen-dev \
            libicu-dev libjpeg-dev liblcms2-dev libnice-dev libopenjp2-7-dev \
            libpng-dev librsvg2-dev libseccomp-dev libunwind-dev \
            libsecret-1-dev libsoup-3.0-dev libsqlite3-dev libssl-dev \
            libsysprof-capture-4-dev libsystemd-dev libtasn1-6-dev \
            libwayland-dev libwebkit2gtk-4.1-dev libwebp-dev libwoff-dev \
            libx11-dev libxcomposite-dev libxdo-dev libxml2-dev \
            libxml2-utils libxslt1-dev libxt-dev libtool ninja-build \
            patch patchelf perl pkg-config python3 ruby tar unifdef \
            wayland-protocols xdg-dbus-proxy xdg-utils xz-utils \
            gstreamer1.0-alsa gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-nice gstreamer1.0-pipewire gstreamer1.0-tools

      - uses: actions/setup-node@v7
        if: env.SHIPPABLE == 'true'
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust toolchain
        if: env.SHIPPABLE == 'true'
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; the toolchain input selects the channel
        with:
          toolchain: '1.97.1'
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: env.SHIPPABLE == 'true'
        with:
          workspaces: src-tauri -> target
          # Only main writes the cache. GitHub already scopes a
          # pull_request run's cache writes to refs/pull/N/*, and
          # rust-cache's key includes the job id, so a PR could not feed
          # main's or release.yml's cache anyway — but a PR is untrusted
          # input and a build that never populates a cache is one less
          # thing to reason about. main populating it is what keeps the
          # per-PR build closer to 30 minutes than 60.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Configure the pinned WebKitGTK runtime prefix
        id: webkit-runtime
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -v PKG_CONFIG_SYSROOT_DIR ]]; then
            echo "::error::PKG_CONFIG_SYSROOT_DIR must be unset for the mixed runtime/system dependency graph"
            exit 1
          fi
          # shellcheck source=scripts/linux-webkit-runtime.env
          source scripts/linux-webkit-runtime.env
          export STUDYVIS_WEBKIT_RUNTIME_DIR="${RUNNER_TEMP}/studyvis-webkit-runtime"
          export STUDYVIS_WEBKIT_BUILD_DIR="${RUNNER_TEMP}/studyvis-webkit-build"
          runtime_dir=$(bash scripts/build-linux-webkit-runtime.sh --print-prefix)
          runtime_pkgconfig=$(bash scripts/build-linux-webkit-runtime.sh --print-pkg-config-path)
          runtime_lib=${runtime_pkgconfig%/pkgconfig}
          {
            echo "STUDYVIS_WEBKIT_RUNTIME_DIR=${runtime_dir}"
            echo "STUDYVIS_WEBKIT_BUILD_DIR=${STUDYVIS_WEBKIT_BUILD_DIR}"
            echo "STUDYVIS_CARGO_C_VERSION=${STUDYVIS_CARGO_C_VERSION}"
            echo "PKG_CONFIG_PATH=${runtime_pkgconfig}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
            echo "LD_LIBRARY_PATH=${runtime_lib}:${GITHUB_WORKSPACE}/src-tauri/binaries/llama-runtime-x86_64-unknown-linux-gnu${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          } >> "$GITHUB_ENV"
          {
            echo "runtime-dir=${runtime_dir}"
            echo "cargo-c-version=${STUDYVIS_CARGO_C_VERSION}"
          } >> "$GITHUB_OUTPUT"

      # Restore/save split for the same reason as ci.yml: actions/cache's post
      # step is post-if: success(), so a failure anywhere downstream threw away
      # the WebKitGTK compile that had already succeeded.
      #
      # The key is split at the manifest boundary so restore-keys can fall back
      # without ever reusing a runtime the build refuses to accept. The first
      # hash covers what `expected_manifest` is derived from — the pinned source
      # tuple in linux-webkit-runtime.env and the portability patches; the
      # second covers the two scripts that change the key but NOT the manifest.
      # Editing the builder used to invalidate a 3.86h compile that
      # `runtime_is_complete` would have accepted unchanged, because the cache
      # key was stricter than the correctness check. The prefix fallback hands
      # that decision back to the script, which byte-compares BUILD-MANIFEST.txt,
      # re-checks the patch/notice SHAs and every packaged ELF, and `rm -rf`s the
      # tree and rebuilds if any of it drifts.
      - name: Restore pinned WebKitGTK runtime
        id: webkit-runtime-cache
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux'
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.webkit-runtime.outputs.runtime-dir }}
          key: studyvis-webkitgtk-${{ runner.os }}-ubuntu-24.04-x86_64-rust-1.97.1-cargo-c-${{ steps.webkit-runtime.outputs.cargo-c-version }}-${{ hashFiles('scripts/linux-webkit-runtime.env', 'scripts/patches/*.patch') }}-${{ hashFiles('scripts/build-linux-webkit-runtime.sh', 'scripts/generate-librice-third-party-notices.mjs') }}
          restore-keys: |
            studyvis-webkitgtk-${{ runner.os }}-ubuntu-24.04-x86_64-rust-1.97.1-cargo-c-${{ steps.webkit-runtime.outputs.cargo-c-version }}-${{ hashFiles('scripts/linux-webkit-runtime.env', 'scripts/patches/*.patch') }}-

      # Same pinned-version-in-the-key reasoning as ci.yml: a hit is the same
      # binary the install below would have produced, and the assertion runs
      # either way.
      - name: Restore pinned cargo-c
        id: cargo-c-cache
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-capi
            ~/.cargo/bin/cargo-cbuild
            ~/.cargo/bin/cargo-cinstall
          key: studyvis-cargo-c-${{ runner.os }}-ubuntu-24.04-rust-1.97.1-${{ steps.webkit-runtime.outputs.cargo-c-version }}

      - name: Install pinned cargo-c
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux' && steps.cargo-c-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-c --version "=${STUDYVIS_CARGO_C_VERSION}" --locked

      - name: Assert the pinned cargo-c version
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          cargo_c_output=$(cargo cinstall --version)
          case "$cargo_c_output" in
            *" ${STUDYVIS_CARGO_C_VERSION}"|*" ${STUDYVIS_CARGO_C_VERSION}+"*) ;;
            *) echo "Unexpected cargo-c version: $cargo_c_output" >&2; exit 1 ;;
          esac

      - name: Install frontend dependencies
        if: env.SHIPPABLE == 'true'
        run: npm ci

      # Release-profile builds fail without a real sidecar binary, by design
      # (build.rs only writes a placeholder for debug builds).
      - name: Fetch llama-server prebuild
        if: env.SHIPPABLE == 'true'
        shell: bash
        env:
          LLAMA_TRIPLE: ${{ matrix.llama-triple }}
        run: bash scripts/fetch-llama-server.sh --triple "$LLAMA_TRIPLE"

      # Ordered ahead of the WebKitGTK compile on purpose, matching ci.yml: it
      # downloads hash-pinned tools and builds the AppImage type-2 runtime, so
      # a bad pin or a runtime build break should surface in minutes instead of
      # after a two-hour compile that the failure discards anyway.
      - name: Prepare the pinned linuxdeploy toolchain
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux'
        shell: bash
        env:
          TOOL_CACHE_HOME: ${{ runner.temp }}/studyvis-tauri-cache-deploy
        run: |
          set -euo pipefail
          bash scripts/prepare-linuxdeploy-tools.sh "$TOOL_CACHE_HOME"
          {
            echo "XDG_CACHE_HOME=$TOOL_CACHE_HOME"
            echo "LDAI_RUNTIME_FILE=$TOOL_CACHE_HOME/studyvis-appimage-runtime-r2/runtime-x86_64"
            echo "GSTREAMER_PLUGINS_DIR=$GITHUB_WORKSPACE/src-tauri/target/appimage-webkit/gstreamer-plugins"
            echo "GSTREAMER_HELPERS_DIR=$GITHUB_WORKSPACE/src-tauri/target/appimage-webkit/gstreamer"
          } >> "$GITHUB_ENV"

      # Preview builds are throwaway artifacts, so they reuse WebKit object
      # files across runs. The tagged release leg has no equivalent step on
      # purpose; see ci.yml's copy of this comment and ARCHITECTURE.md §2.
      - name: Install pinned sccache
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux'
        env:
          SCCACHE_VERSION: 0.17.0
          SCCACHE_SHA256: 67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006
        run: |
          set -euo pipefail
          tarball="sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' \
            --tlsv1.2 --retry 3 -o "$tarball" \
            "https://github.com/mozilla/sccache/releases/download/v${SCCACHE_VERSION}/${tarball}"
          echo "${SCCACHE_SHA256}  ${tarball}" | sha256sum --check --strict -
          tar --extract --file "$tarball" --strip-components=1 \
            "sccache-v${SCCACHE_VERSION}-x86_64-unknown-linux-musl/sccache"
          sudo install -m 0755 sccache /usr/local/bin/sccache
          rm -f -- "$tarball" sccache
          sccache --version

      - name: Restore the WebKit compiler cache
        id: webkit-sccache
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux'
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/studyvis-sccache
          key: studyvis-sccache-webkit-ubuntu-24.04-${{ hashFiles('scripts/linux-webkit-runtime.env', 'scripts/patches/*.patch') }}-${{ github.sha }}
          restore-keys: |
            studyvis-sccache-webkit-ubuntu-24.04-${{ hashFiles('scripts/linux-webkit-runtime.env', 'scripts/patches/*.patch') }}-
            studyvis-sccache-webkit-ubuntu-24.04-

      - name: Build or verify the pinned WebKitGTK runtime
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux'
        env:
          SCCACHE_DIR: ${{ runner.temp }}/studyvis-sccache
          SCCACHE_CACHE_SIZE: 3G
          CMAKE_C_COMPILER_LAUNCHER: sccache
          CMAKE_CXX_COMPILER_LAUNCHER: sccache
          RUNTIME_DIR: ${{ steps.webkit-runtime.outputs.runtime-dir }}
        run: |
          set -euo pipefail
          bash scripts/build-linux-webkit-runtime.sh
          sccache --show-stats
          # Both of these land in the 10 GB per-repository cache budget, which
          # the rust-cache entries already crowd. Print the sizes so a future
          # eviction is diagnosable from the log instead of inferred.
          du -sh "$RUNTIME_DIR" "$SCCACHE_DIR"

      - name: Save the WebKit compiler cache
        if: ${{ !cancelled() && env.SHIPPABLE == 'true' && runner.os == 'Linux' && steps.webkit-sccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/studyvis-sccache
          key: studyvis-sccache-webkit-ubuntu-24.04-${{ hashFiles('scripts/linux-webkit-runtime.env', 'scripts/patches/*.patch') }}-${{ github.sha }}

      - name: Save the pinned WebKitGTK runtime
        if: ${{ success() && env.SHIPPABLE == 'true' && runner.os == 'Linux' && steps.webkit-runtime-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.webkit-runtime.outputs.runtime-dir }}
          key: studyvis-webkitgtk-${{ runner.os }}-ubuntu-24.04-x86_64-rust-1.97.1-cargo-c-${{ steps.webkit-runtime.outputs.cargo-c-version }}-${{ hashFiles('scripts/linux-webkit-runtime.env', 'scripts/patches/*.patch') }}-${{ hashFiles('scripts/build-linux-webkit-runtime.sh', 'scripts/generate-librice-third-party-notices.mjs') }}

      - name: Remove a cached Linux preview output
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          appimage="${GITHUB_WORKSPACE}/src-tauri/target/release/bundle/appimage/StudyVis_${version}_amd64.AppImage"
          rm -f "$appimage" "${appimage}.sig"

      # The config override is what makes this safe to run without secrets:
      # with createUpdaterArtifacts on, the bundler demands the minisign key
      # and fails. Off, it emits only the installer — which is all a smoke
      # test needs, and means no deployment artifact from here can ever be
      # fed to a client's updater.
      - name: Build the installer (unsigned, no updater artifacts)
        if: env.SHIPPABLE == 'true'
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
        run: |
          # BUILD_ARGS is a flag list ("--target … --bundles …") and MUST word-
          # split, so it stays unquoted here on purpose.
          # shellcheck disable=SC2086
          npm run tauri -- build $BUILD_ARGS \
            --config '{"bundle":{"createUpdaterArtifacts":false,"linux":{"appimage":{"bundleMediaFramework":true}}}}'

      - name: Verify notices in the exact macOS preview DMG
        if: env.SHIPPABLE == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/aarch64-apple-darwin/release/bundle"
          count=$(find "$bundle_root" -type f -name '*.dmg' -print | awk 'END { print NR + 0 }')
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one freshly built DMG, found $count"
            exit 1
          fi
          dmg=$(find "$bundle_root" -type f -name '*.dmg' -print)
          mountpoint=$(mktemp -d "${RUNNER_TEMP}/studyvis-dmg.XXXXXX")
          attached=false
          cleanup() {
            if $attached; then hdiutil detach "$mountpoint"; fi
            rmdir "$mountpoint" 2>/dev/null || true
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint"
          attached=true
          npm run check-notice-bundle -- "$mountpoint"

      - name: Verify notices in the exact Windows preview installer
        if: env.SHIPPABLE == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle' -Recurse -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) {
            throw "Expected exactly one freshly built NSIS installer, found $($installers.Count)"
          }
          $unpack = Join-Path $env:RUNNER_TEMP "studyvis-nsis-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $unpack | Out-Null
          try {
            & 7z x '-y' "-o$unpack" $installers[0].FullName
            if ($LASTEXITCODE -ne 0) {
              throw "7-Zip could not extract the exact NSIS installer (exit $LASTEXITCODE)"
            }
            npm run check-notice-bundle -- $unpack
            if ($LASTEXITCODE -ne 0) {
              throw "Bundled third-party notice verification failed (exit $LASTEXITCODE)"
            }
          } finally {
            Remove-Item -Recurse -Force $unpack -ErrorAction SilentlyContinue
          }

      - name: Validate the exact Linux preview AppImage
        if: env.SHIPPABLE == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          appimage="${GITHUB_WORKSPACE}/src-tauri/target/release/bundle/appimage/StudyVis_${version}_amd64.AppImage"
          test -f "$appimage"
          bash scripts/check-linux-appimage.sh "$appimage"

      - name: Collect the installer
        if: env.SHIPPABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find src-tauri/target -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' -o -name '*.AppImage' \) \
            -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v7
        if: env.SHIPPABLE == 'true'
        with:
          # Named for whoever downloads it, not for the build system:
          # `StudyVis-macOS-arm64-pr141`, not `studyvis-aarch64-apple-darwin-141`.
          #
          # NOT github.ref_name in the suffix: upload-artifact rejects any name
          # containing '/', and every branch here is namespaced (ci/…, feat/…,
          # fix/…). A workflow_dispatch run would build for 30-60 minutes and
          # then die on the upload. run_id is always slash-free and unique.
          name: StudyVis-${{ matrix.label }}-${{ matrix.arch }}-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.run_id }}
          path: out/
          if-no-files-found: error
          # Unsigned installers of unreviewed code. Short retention keeps
          # them from lingering as a download anyone might mistake for a
          # release.
          retention-days: 7

      - name: Explain what this build is
        if: env.SHIPPABLE == 'true'
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "### ${LABEL} installer (${ARCH})"
            echo
            echo "Unsigned, **not** a release, no auto-update manifest."
            echo "See INSTALL.md for platform-specific first-run requirements."
            echo "Installing this over a real StudyVis install replaces it."
          } >> "$GITHUB_STEP_SUMMARY"

  # One check summarising every platform, so the PR has a single line to read
  # rather than three to correlate. It mints no deployment record of its own —
  # those belong to the per-platform jobs above, which are the only things
  # that know what actually got built.
  #
  # It reports a real pass/fail — a broken platform build turns this red — but
  # it is NOT in the ruleset and must not be added there without accepting the
  # ~30-60 min per platform it would add to every merge. See the file header.
  deployed:
    name: Deployed
    # !cancelled(), not always(): always() is true for a CANCELLED run too,
    # and with cancel-in-progress on every superseded push would spin this
    # job up, read 'cancelled' from its needs, and report a hard failure for
    # a run nobody was waiting on.
    if: ${{ !cancelled() }}
    needs: [scope, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # `installer` has no job-level `if:`, so once `scope` succeeds it always
      # runs and its result is a genuine pass/fail rather than a `skipped` that
      # could mean either "nothing to build" or "the dependency died". That is
      # what lets this be a plain two-step check. ci.yml separately sweeps all
      # of its unconditional `needs` entries and fails closed on non-success.
      - name: Report whether this commit deployed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
          INSTALLABLE: ${{ needs.scope.outputs.installable }}
        run: |
          set -euo pipefail

          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::deploy scope could not be determined (${SCOPE_RESULT}) — nothing was deployed."
            exit 1
          fi

          if [ "$INSTALLABLE" != "true" ]; then
            if [ "$INSTALLER_RESULT" != "success" ]; then
              echo "::error::nothing shippable changed, yet the installer job reported '${INSTALLER_RESULT}'. That is a workflow bug, not a build break."
              exit 1
            fi
            {
              echo "### Deployed — documentation only"
              echo
              echo "No shippable file changed, so no installer was built."
              echo
              echo "_Indicator only — merging does not wait for this._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$INSTALLER_RESULT" != "success" ]; then
            echo "::error::the installer build did not succeed (${INSTALLER_RESULT}) — this commit changes shippable code that no longer builds on at least one platform. Check the macOS, Windows, and Linux installer legs to see which. This does NOT block the merge; it is telling you something is broken."
            exit 1
          fi
          {
            echo "### Deployed"
            echo
            echo "macOS (arm64), Windows (x64), and Linux (x64) installers were built from"
            echo "this commit and attached to the run. Download them from the"
            echo "**Artifacts** section of this page if you want to smoke-test."
            echo
            echo "_Indicator only — merging does not wait for this._"
          } >> "$GITHUB_STEP_SUMMARY"
