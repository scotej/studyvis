name: Deploy

# AN INDICATOR, NOT A GATE. Nothing waits for this workflow.
#
# Read this before adding `Deployed` to branch protection: it is not meant to
# be there. A full Tauri build is ~30-60 minutes per platform, so requiring it
# would put every docs fix and dependency bump behind an hour of wall-clock
# for a signal that is almost always "yes, it still builds". Merging waits on
# the FAST checks — `All pre-merge checks` (ci.yml) and `PR title`
# (pr-title.yml) — and those two remain the only required ones. This workflow
# runs alongside them and reports: green means the commit produced installable
# bundles, red means a platform stopped building. Either way the merge button
# is live as soon as the fast checks finish.
#
# So a red `Deployed` is information, not a blocker. Look at it before you
# merge if the change is shippable; act on it when it is red; never sit and
# wait for it. If it turns out to catch things often enough to be worth the
# wall-clock, promoting it to required is a one-line ruleset edit — that is a
# deliberate future decision, not the current setup.
#
# What it actually does: every commit that reaches a pull request or main is
# built into a real, installable StudyVis bundle for each shipped platform
# from that exact SHA, published as the run's artifacts, and recorded as a
# GitHub Deployment — one per platform, to `preview-macos` and
# `preview-windows`, because the two artifacts succeed and fail
# independently.
#
# This replaces .github/workflows/pr-build.yml ("PR installers"), which ran
# the same build behind a `build-installers` label. The reasoning for that
# label was sound and is kept — a full Tauri build is expensive and most PRs
# here are docs or CI — but it is now encoded as the `scope` job below rather
# than left to whoever remembers to apply a label. A change that touches no
# shippable file is deployed as a docs-only change; everything else builds.
# What is gone is having to opt IN: a shippable change now always gets its
# bundle, whether or not anyone thought to ask for one.
#
# Why this matters more here than on a typical project: CI proves the code
# compiles, lints, and passes the automated gates, and that is genuinely all
# it proves. There are no component tests (vitest is node-env only), no
# desktop smoke test, and the things this app gets wrong most often — a
# camera stream that never reaches a late joiner, a sidecar that dies at
# session start — are only visible with two real builds talking to each
# other. Before this workflow, the first installable build of any change
# appeared AFTER release-prep had already pushed an immutable tag.
#
# These bundles are NOT releases. `createUpdaterArtifacts` is switched off
# below, so no `latest.json` is produced and nothing here can be mistaken
# for — or consumed by — the update channel (X6).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Deliberately the same shape as ci.yml, including the activity types left at
# their defaults. #102 is the reason: an event that re-fires on an UNCHANGED
# commit (`edited`, `ready_for_review`) combines with cancel-in-progress to
# leave a `cancelled` required check beside a successful one on the same SHA,
# and the PR then sits at BLOCKED with everything green. Only opened /
# synchronize / reopened, all of which mean a new head commit to deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# See ci.yml's header: third-party actions are hash-pinned (enforced by the
# zizmor policy in .github/zizmor.yml), actions/* stay on major tags, and the
# workflow token is read-only. The deployment records come from the
# `environment:` key, which the Actions service mints on the job's behalf —
# no `deployments: write` is needed here.
permissions:
  contents: read

jobs:
  # Which surface does this commit actually change? A docs or CI-only commit
  # has no installable surface, and spending two hours of runner time to
  # produce a byte-identical bundle for it would make the gate something
  # people route around rather than something that catches breakage.
  scope:
    name: Deploy scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      installable: ${{ steps.classify.outputs.installable }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Pinned to the PR head, not left to default to `refs/pull/N/merge`
          # (PR #141 review). GitHub recomputes the merge ref whenever the base
          # branch moves, so two jobs in the same run can otherwise resolve it
          # to different trees — and the artifact this workflow hands you would
          # be a commit that exists in nobody's clone. Both checkouts in this
          # file use this identical expression; keep them in step.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The diff below needs the base commit reachable; a shallow clone
          # does not have it.
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change
        id: classify
        env:
          # Via env, never inlined into the script: a branch name is
          # attacker-controlled on a fork PR, and interpolating one straight
          # into a run block is the template-injection shape zizmor exists
          # to catch.
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Any path NOT matched here is treated as shippable. The list is
          # deliberately an allowlist of things that cannot reach a user's
          # installed copy — err towards building.
          non_shippable='^(.*\.md|\.github/.*|\.gitignore|\.editorconfig|LICENSE.*|_typos\.toml)$'

          case "$EVENT_NAME" in
            pull_request) base="$BASE_SHA" ;;
            push)         base="$BEFORE_SHA" ;;
            *)            base='' ;;
          esac

          # workflow_dispatch has no diff, and a force-push or a branch's
          # first commit leaves `before` as the all-zero SHA. Both mean "we
          # cannot prove nothing shippable changed", which resolves to
          # building, not to skipping.
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable base commit — deploying the full installable surface."
            echo "installable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Three dots, not two, and that is load-bearing now that HEAD is the
          # PR head rather than the merge commit. `git diff base HEAD` asks
          # "how do these two trees differ", so once the base branch moves
          # ahead of the branch point it reports the base's OWN new commits as
          # if this PR reverted them. Measured on this branch: two-dot claimed
          # 27 changed files (18 shippable) for a PR that had changed nothing,
          # which would build installers for every PR with a stale base.
          # `base...HEAD` diffs from the merge-base instead — the PR's own
          # changes, which is the question being asked.
          changed=$(git diff --name-only "$base...HEAD")
          shippable=$(printf '%s\n' "$changed" | grep -Ev "$non_shippable" || true)

          {
            echo "### Deploy scope"
            echo
            echo "\`$(printf '%s\n' "$changed" | grep -c . || true)\` file(s) changed since \`${base:0:7}\`."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$shippable" ]; then
            echo "installable=true" >> "$GITHUB_OUTPUT"
            {
              echo
              echo "Shippable files changed — building an installer for both platforms:"
              echo
              echo '```'
              printf '%s\n' "$shippable" | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "installable=false" >> "$GITHUB_OUTPUT"
            {
              echo
              echo "Docs/CI only — no installable surface changed, so no"
              echo "installer is built and this commit is deployed as a"
              echo "documentation change."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  installer:
    name: Installer (${{ matrix.label }})
    needs: scope
    runs-on: ${{ matrix.platform }}
    # 90, not the 60 release.yml uses: this job does everything that one does
    # plus `npm ci` and the sidecar fetch, and a build can take up to 60
    # minutes on its own. A timeout that can kill a slow-but-valid run after
    # an hour of work is worth nothing — public-repo minutes are free.
    timeout-minutes: 90
    permissions:
      contents: read
    # The guard is on the STEPS, not on the job, and that is deliberate — do
    # not "simplify" it back to a job-level `if:`. GitHub resolves a matrix
    # job's display name only when the job actually runs, so a leg skipped by
    # a job-level `if:` reports its check under the LITERAL, unexpanded name.
    # This job used to carry `if: needs.scope.outputs.installable == 'true'`
    # and every docs PR grew a check literally called
    # "Build ${{ matrix.label }}" — observed on PR #141, not theoretical.
    # Letting the job start and no-op costs ~20s of free public-repo runner
    # time and gives both platforms a correctly-named, always-present
    # indicator instead.
    #
    # The cost of that choice: a docs-only commit still mints both deployment
    # records below, having built nothing. The step summary and the `Deployed`
    # rollup both say so. Avoiding it would mean per-leg job outputs feeding
    # two extra statically-named jobs, which is a lot of machinery for two
    # rows in a low-traffic tab.
    env:
      SHIPPABLE: ${{ needs.scope.outputs.installable }}
    # One deployment record PER PLATFORM, minted here rather than on the
    # rollup job below. It has to be here: a matrix job's `result` collapses
    # every leg into a single value, so a job downstream of this one cannot
    # tell "macOS shipped, Windows broke" from "both broke" — it would mint
    # one deployment for two independent artifacts. Each leg deploying to its
    # own environment means the Deployments tab shows exactly what exists.
    environment:
      name: ${{ matrix.environment }}
      # No stable per-artifact URL exists at this point, so both point at the
      # run, which is where the download actually is.
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS
            arch: arm64
            environment: preview-macos
            platform: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
            llama-triple: aarch64-apple-darwin
          - label: Windows
            arch: x64
            environment: preview-windows
            platform: windows-latest
            rust-targets: ''
            args: --bundles nsis
            llama-triple: x86_64-pc-windows-msvc

    steps:
      # Green on a docs commit means "nothing needed building", not "the
      # installer is fine". Say so where someone reading the check will see it.
      # Every `run:` below takes its matrix values through `env:` rather than
      # `${{ }}` interpolation. These particular values are static literals in
      # this file, so neither form is exploitable — but zizmor flags the
      # interpolated shape on sight, and a workflow that mints installers
      # should not be teaching the pattern that a later, less static value
      # would follow.
      - name: Nothing to build
        if: env.SHIPPABLE != 'true'
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
        run: |
          {
            echo "### ${LABEL} installer"
            echo
            echo "Not built — this commit changes no shippable file."
          } >> "$GITHUB_STEP_SUMMARY"

      # `pull_request`, never `pull_request_target`: fork code runs with a
      # read-only token and no access to secrets, and nothing here needs
      # either. The artifact is an unsigned installer built from unreviewed
      # code — treat a fork PR's bundle accordingly before running it.
      - uses: actions/checkout@v7
        if: env.SHIPPABLE == 'true'
        with:
          # Same expression as the scope job's checkout — see the comment
          # there. The installer you download is built from the commit you
          # pushed, not from a merge ref that may have been recomputed.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: env.SHIPPABLE == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        if: env.SHIPPABLE == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; the toolchain input selects the channel
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: env.SHIPPABLE == 'true'
        with:
          workspaces: src-tauri -> target
          # Only main writes the cache. GitHub already scopes a
          # pull_request run's cache writes to refs/pull/N/*, and
          # rust-cache's key includes the job id, so a PR could not feed
          # main's or release.yml's cache anyway — but a PR is untrusted
          # input and a build that never populates a cache is one less
          # thing to reason about. main populating it is what keeps the
          # per-PR build closer to 30 minutes than 60.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        if: env.SHIPPABLE == 'true'
        run: npm ci

      # Release-profile builds fail without a real sidecar binary, by design
      # (build.rs only writes a placeholder for debug builds).
      - name: Fetch llama-server prebuild
        if: env.SHIPPABLE == 'true'
        shell: bash
        env:
          LLAMA_TRIPLE: ${{ matrix.llama-triple }}
        run: bash scripts/fetch-llama-server.sh --triple "$LLAMA_TRIPLE"

      # The config override is what makes this safe to run without secrets:
      # with createUpdaterArtifacts on, the bundler demands the minisign key
      # and fails. Off, it emits only the installer — which is all a smoke
      # test needs, and means no deployment artifact from here can ever be
      # fed to a client's updater.
      - name: Build the installer (unsigned, no updater artifacts)
        if: env.SHIPPABLE == 'true'
        shell: bash
        env:
          BUILD_ARGS: ${{ matrix.args }}
        run: |
          # BUILD_ARGS is a flag list ("--target … --bundles …") and MUST word-
          # split, so it stays unquoted here on purpose.
          # shellcheck disable=SC2086
          npm run tauri -- build $BUILD_ARGS \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Collect the installer
        if: env.SHIPPABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find src-tauri/target -type f \
            \( -name '*.dmg' -o -name '*-setup.exe' \) \
            -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v7
        if: env.SHIPPABLE == 'true'
        with:
          # Named for whoever downloads it, not for the build system:
          # `StudyVis-macOS-arm64-pr141`, not `studyvis-aarch64-apple-darwin-141`.
          #
          # NOT github.ref_name in the suffix: upload-artifact rejects any name
          # containing '/', and every branch here is namespaced (ci/…, feat/…,
          # fix/…). A workflow_dispatch run would build for 30-60 minutes and
          # then die on the upload. run_id is always slash-free and unique.
          name: StudyVis-${{ matrix.label }}-${{ matrix.arch }}-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.run_id }}
          path: out/
          if-no-files-found: error
          # Unsigned installers of unreviewed code. Short retention keeps
          # them from lingering as a download anyone might mistake for a
          # release.
          retention-days: 7

      - name: Explain what this build is
        if: env.SHIPPABLE == 'true'
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "### ${LABEL} installer (${ARCH})"
            echo
            echo "Unsigned, **not** a release, no auto-update manifest."
            echo "Expect the usual Gatekeeper/SmartScreen warning (INSTALL.md)."
            echo "Installing this over a real StudyVis install replaces it."
          } >> "$GITHUB_STEP_SUMMARY"

  # One check summarising both platforms, so the PR has a single line to read
  # rather than two to correlate. It mints no deployment record of its own —
  # those belong to the per-platform jobs above, which are the only things
  # that know what actually got built.
  #
  # It reports a real pass/fail — a broken platform build turns this red — but
  # it is NOT in the ruleset and must not be added there without accepting the
  # ~30-60 min per platform it would add to every merge. See the file header.
  deployed:
    name: Deployed
    # !cancelled(), not always(): always() is true for a CANCELLED run too,
    # and with cancel-in-progress on every superseded push would spin this
    # job up, read 'cancelled' from its needs, and report a hard failure for
    # a run nobody was waiting on.
    if: ${{ !cancelled() }}
    needs: [scope, installer]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # `installer` has no job-level `if:`, so once `scope` succeeds it always
      # runs and its result is a genuine pass/fail rather than a `skipped` that
      # could mean either "nothing to build" or "the dependency died". That is
      # what lets this be a plain two-step check instead of ci.yml's jq sweep
      # over `needs` — whose "skipped counts as a pass" shortcut is only safe
      # there because no job in that file depends on another.
      - name: Report whether this commit deployed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          INSTALLER_RESULT: ${{ needs.installer.result }}
          INSTALLABLE: ${{ needs.scope.outputs.installable }}
        run: |
          set -euo pipefail

          if [ "$SCOPE_RESULT" != "success" ]; then
            echo "::error::deploy scope could not be determined (${SCOPE_RESULT}) — nothing was deployed."
            exit 1
          fi

          if [ "$INSTALLABLE" != "true" ]; then
            if [ "$INSTALLER_RESULT" != "success" ]; then
              echo "::error::nothing shippable changed, yet the installer job reported '${INSTALLER_RESULT}'. That is a workflow bug, not a build break."
              exit 1
            fi
            {
              echo "### Deployed — documentation only"
              echo
              echo "No shippable file changed, so no installer was built."
              echo
              echo "_Indicator only — merging does not wait for this._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$INSTALLER_RESULT" != "success" ]; then
            echo "::error::the installer build did not succeed (${INSTALLER_RESULT}) — this commit changes shippable code that no longer builds on at least one platform. Check Installer (macOS) and Installer (Windows) to see which. This does NOT block the merge; it is telling you something is broken."
            exit 1
          fi
          {
            echo "### Deployed"
            echo
            echo "macOS (arm64) and Windows (x64) installers were built from"
            echo "this commit and attached to the run. Download them from the"
            echo "**Artifacts** section of this page if you want to smoke-test."
            echo
            echo "_Indicator only — merging does not wait for this._"
          } >> "$GITHUB_STEP_SUMMARY"
