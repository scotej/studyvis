[package]
name = "studyvis"
version = "1.11.0"
description = "Peer-to-peer study app for friends"
authors = ["StudyVis"]
license = ""
repository = ""
edition = "2021"
# ed25519-dalek 3 is edition 2024 and needs 1.85. Nothing enforces this — the
# workflows all build on `stable` and resolver 2 ignores rust-version — so the
# declared floor is documentation that has to be kept honest by hand.
rust-version = "1.85"
# This crate is the application, not a library anyone consumes — it has no
# license expression and must never reach crates.io. Marking it explicitly is
# also what lets cargo-deny's `[licenses.private] ignore` skip it instead of
# failing the audit on its own empty `license` field (see deny.toml).
publish = false

[lib]
name = "studyvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
ed25519-dalek = "3"
hex = "0.4"
base64 = "0.23"
crypto_box = { version = "0.9", features = ["salsa20", "seal"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.11"
futures-util = "0.3"
# I73 engine auto-install — unpack the pinned llama.cpp release archives
# (mac/linux .tar.gz, windows .zip). All three compile everywhere so the
# extraction code and its tests run on both CI legs.
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
battery = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
# V2-P7 — AI dialog window needs NSWindowCollectionBehavior canJoinAllSpaces
# | fullScreenAuxiliary so the floating Ctrl+] dialog appears OVER macOS
# fullscreen apps. Tauri's WebviewWindowBuilder doesn't expose the
# collection-behavior bits, so we drop into AppKit. `objc2` matches the
# pattern Tauri 2 uses internally (`ns_window()` returns a raw pointer
# we cast back into `objc2_app_kit::NSWindow`).
objc2 = "0.6"
objc2-app-kit = "0.3"
# I79 — the display-capture UI-delegate method WebKit is missing takes a
# completion block; block2 is how we invoke it. Already in the graph beneath
# wry, so this adds no new package.
block2 = "0.6"
# Issue #77 — `system_install_context` asks statfs whether the bundle sits on
# a read-only mount (the app-translocated .dmg case the updater can't swap).
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

# Linux custody is the freedesktop Secret Service (gnome-keyring, KWallet,
# KeePassXC — whatever owns org.freedesktop.secrets on the session bus).
# `sync-secret-service` keeps the blocking API the Tauri commands already use;
# the async backend would drag a runtime in for no gain. `crypto-rust` encrypts
# the session transport with RustCrypto rather than linking OpenSSL. Building
# this target needs libdbus-1-dev — see the Linux leg in .github/workflows/ci.yml.
#
# Linux is NOT a release target (PLAN §8): this exists so the app is runnable
# and testable on a Linux dev box, and so the shared identity code stops
# silently vanishing from that platform's build.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
  "sync-secret-service",
  "crypto-rust",
] }
