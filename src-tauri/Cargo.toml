[package]
name = "studyvis"
version = "1.11.3-rc.2"
description = "Peer-to-peer study app for friends"
authors = ["StudyVis"]
license = ""
repository = ""
edition = "2021"
# Keep the declared compiler requirement aligned with the exact toolchain used
# by local, CI, and release verification. We do not claim an older MSRV without
# continuously testing it.
rust-version = "1.97.1"
# This crate is the application, not a library anyone consumes — it has no
# license expression and must never reach crates.io. Marking it explicitly is
# also what lets cargo-deny's `[licenses.private] ignore` skip it instead of
# failing the audit on its own empty `license` field (see deny.toml).
publish = false

[lib]
name = "studyvis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
ed25519-dalek = "3"
hex = "0.4"
base64 = "0.23"
crypto_box = { version = "0.9", features = ["salsa20", "seal"] }
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.11"
futures-util = "0.3"
# I73 engine auto-install — unpack the pinned llama.cpp release archives
# (mac/linux .tar.gz, windows .zip). All three compile everywhere so the
# extraction code and its tests run on all three CI legs.
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
battery = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }
# V2-P7 — AI dialog window needs NSWindowCollectionBehavior canJoinAllSpaces
# | fullScreenAuxiliary so the floating Ctrl+] dialog appears OVER macOS
# fullscreen apps. Tauri's WebviewWindowBuilder doesn't expose the
# collection-behavior bits, so we drop into AppKit. `objc2` matches the
# pattern Tauri 2 uses internally (`ns_window()` returns a raw pointer
# we cast back into `objc2_app_kit::NSWindow`).
objc2 = "0.6"
objc2-app-kit = "0.3"
# I79 — the display-capture UI-delegate method WebKit is missing takes a
# completion block; block2 is how we invoke it. Already in the graph beneath
# wry, so this adds no new package.
block2 = "0.6"

[target.'cfg(unix)'.dependencies]
# `system_install_context` uses macOS `statfs`, and the backup importer uses
# `O_NONBLOCK` to reject Unix special files without opening a blocking FIFO.
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

# Linux custody is the freedesktop Secret Service (gnome-keyring, KWallet,
# KeePassXC — whatever owns org.freedesktop.secrets on the session bus).
# `sync-secret-service` keeps the blocking API the Tauri commands already use;
# the async backend would drag a runtime in for no gain. `crypto-rust` encrypts
# the session transport with RustCrypto rather than linking OpenSSL. Building
# this target needs libdbus-1-dev — see the Linux leg in .github/workflows/ci.yml.
#
# The Linux candidate is an x86_64 AppImage (PLAN §8). Secret Service is a
# candidate runtime dependency, not merely a compile-time portability check.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", default-features = false, features = [
  "sync-secret-service",
  "crypto-rust",
] }
# Tauri exposes the native WebKitGTK handle but not the permission-request
# traits. Keep this exact version aligned with wry 0.55.1 so the Linux bridge
# can allow camera/mic/display requests only while the top-level webview URI is
# StudyVis-owned. WebKitGTK does not expose the request SecurityOrigins here.
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[patch.crates-io]
# Tauri/wry exposes its WebKitGTK handle only after native WebView construction.
# This exact 0.55.1 source copy supplies WebRTC/media settings in that native
# construction phase so the first document receives the preference enabled by
# StudyVis's bundled WebKitGTK build; see vendor/wry/src/webkitgtk/mod.rs. Remove
# the patch as soon as upstream wry grows an equivalent supported builder option.
wry = { path = "vendor/wry" }
