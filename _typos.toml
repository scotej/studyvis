# Spell-check config for `typos`, run in CI over docs, code, and user-facing
# copy. It earns its place mainly because of `src/strings.ts`: that file is
# the single source of truth for every toast and notification a friend ever
# reads, and a typo there ships to installed builds and stays until the next
# release.
#
# Everything below is an accepted word or a pattern that only *looks* like a
# misspelling — checked one by one against the source, not batch-silenced.

[files]
extend-exclude = [
  "package-lock.json",
  "src-tauri/Cargo.lock",
  "dist",
  "storybook-static",
  "src-tauri/target",
  "src-tauri/gen",
  # Vendored Wry source remains byte-close to its upstream revision; its
  # historical comment spelling is not StudyVis product copy.
  "src-tauri/vendor",
  # These notice inventories preserve third-party package names, attributions,
  # and license text verbatim. Their generator verifies integrity separately.
  "THIRD-PARTY-NOTICES.txt",
  "THIRD-PARTY-NOTICES.json",
  "src-tauri/resources/THIRD-PARTY-NOTICES.txt",
  "src-tauri/resources/THIRD-PARTY-NOTICES.json",
  "scripts/licenses",
  "scripts/third-party-licenses",
  # The frozen WebKit patch is hash-pinned and validated against pristine
  # upstream source; checking its inherited context would make it mutable.
  "scripts/patches",
]

[default]
# Scoped patterns, not global word overrides. `extend-words` silences a
# correction EVERYWHERE — writing `mis = "mis"` to excuse "mis-decoding"
# would also let a genuine stray "mis" through in src/strings.ts, which is
# the file this check mainly exists for. Each pattern below matches only the
# shape that actually occurs.
extend-ignore-re = [
  # Pair / contact links are base64url payloads in stories and tests; every
  # two-letter slice of one is a potential "typo".
  "studyvis://[A-Za-z0-9+/=_#-]+",
  # Base64 capture fixture in tests/unit/ai-capture.test.ts (-> "Iz").
  "YWJjMTIz",
  # Lock-ordering notation in sidecar.rs ("an AB-BA deadlock").
  "AB-BA",
  # "mis-" as a hyphenated English prefix: mis-decoding, mis-associated,
  # mis-decode. A bare "mis" is still corrected.
  "\\bmis-[a-z]+",
  # `NULLable` in a sessions.rs comment on SQLite column nullability, which
  # the checker splits into "NULL" + "Lable".
  "\\bNULLable\\b",
  # `PNGs` in generate-icons.mjs, split into "PN" + "Gs".
  "\\bPNGs?\\b",
  # musl's generated configuration filename in the pinned runtime builder.
  "\\bconfig\\.mak\\b",
]

[default.extend-identifiers]
# Whole-identifier match: the local binding in reportSerialize.ts holding the
# formatted deduction suffix. Prose containing "ded" is still corrected.
ded = "ded"

[default.extend-words]
# Genuine vocabulary, so a global allowance is the right scope for these.
#
# Both spellings are standard; the codebase uses this one consistently across
# nine sites (Rust, TS, SQL comments, tests, docs). Changing them all to
# satisfy a linter would be churn, not a fix.
unparseable = "unparseable"
# Real word — "the toast alone was missable" in strings.ts.
missable = "missable"
# ISSUES.md counts advisories by severity: "criticals: concurrently@9 → ...".
criticals = "criticals"
# Proper name of the reference MQTT broker used only in explanatory comments.
mosquitto = "mosquitto"
